/* V2.0.4 */
.top-action { position: relative; transition: background .18s ease, color .18s ease, transform .12s ease, box-shadow .18s ease; }
.top-action:hover { transform: translateY(-1px); }
.top-action.is-active { background:#dbeafe !important; color:#1d4ed8 !important; box-shadow: inset 0 0 0 1px rgba(37,99,235,.25); }
.top-action .tip {
  pointer-events:none; opacity:0; visibility:hidden; position:absolute; z-index:1000;
  top:calc(100% + 8px); left:50%; transform:translate(-50%,-4px);
  white-space:nowrap; background:#111827; color:#fff; font-size:12px; font-weight:600;
  padding:7px 9px; border-radius:7px; box-shadow:0 5px 18px rgba(0,0,0,.2);

}
.top-action:hover .tip { opacity:1; visibility:visible; transform:translate(-50%,0); }
#currentCard, #prevCard, #nextCard { transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s ease, font-size .28s ease; }
.prompt-shift #prevCard { transform:translateY(-5px) scale(.97); opacity:.55; }

.prompt-shift #nextCard { transform:translateY(-4px) scale(.985); opacity:.72; }
.v2-progress-wrap { margin-top:12px; padding:4px 2px 0; }
.v2-progress {
  position:relative; height:28px; cursor:pointer; user-select:none; touch-action:manipulation;
}
.v2-progress-track { position:absolute; left:0; right:0; top:12px; height:5px; border-radius:99px; background:#e5e7eb; overflow:hidden; }
.v2-progress-fill { height:100%; width:0%; background:#2563eb; border-radius:99px; transition:width .22s ease; }
.v2-progress-thumb {
  position:absolute; top:7px; left:0%; width:15px; height:15px; border-radius:50%; background:#2563eb;
  border:3px solid white; box-shadow:0 1px 5px rgba(0,0,0,.25); transform:translateX(-50%);
  transition:left .22s ease, transform .15s ease;
}
.v2-progress:hover .v2-progress-thumb { transform:translateX(-50%) scale(1.2); }
.v2-tick { position:absolute; top:10px; width:1px; height:9px; background:#9ca3af; opacity:.55; }
.v2-progress-labels { display:flex; justify-content:space-between; font-size:11px; color:#6b7280; margin-top:-2px; }

{t:'stage',x:'Voix off ou Présentateur/trice – Ecosse – 1040 - A l’orée d’une forêt.'},{t:'stage',x:'Arrivée des sorcières Ririte, Fifite, puis Liloute – plus tard- sur leurs balais- bruit de motorisation + freins- motorisation électrique pour Liloute.'},
{c:'Fifite',x:'Salut Ririte !'},{c:'Ririte',x:'Salut Fifite !',d:'Elles descendent de leur « véhicule »'},{c:'Fifite',x:'Tu n’as pas vu Liloute ?'},{c:'Ririte',x:'Ben non, j’étais chez le meccano (trouver d’autres éléments sur véhicule…)'},{c:'Fifite',x:'Chez le meccano ?'},{c:'Ririte',x:'Oui, j’avais ma révision des 40 balais !',d:'Elles balancent leur balais vers les coulisses, et on entend les dégâts ou / et un aïe'},{c:'Fifite',x:'T’as raison, faut toujours balayer devant sa porte !',d:'autre bruit de motorisation'},{c:'Liloute',x:'Salut les filles. Désolée, mais il faut bien une voiture balai ; donc me voici !'},{t:'stage',x:'Chants / geste de rencontre.'},
{c:'Fifite',x:'Eh, je voulais qu’on s’voie pour savoir quand est-ce qu’on s’voie ?'},{c:'Ririte',x:'Quand est-ce qu’on se rencontre pour la prochaine fois ?'},{c:'Ririte',x:'Oui, pour marquer la victoire de Macbeth ?'},{c:'Liloute',x:'Pour marquer la victoire de Macbeth, et c’est qui c’Macbeth ?',d:'air incrédule très surpris'},{c:'Fifite',x:'C’est ce valeureux chevalier et son compère Banco !'},{c:'Ririte',x:'Macbeth, alias Comte de Glamis, Macbeth, qui a gagné et repoussé l’ennemi !'},{c:'Liloute',x:'Non, Macbeth a gagné et repoussé l’ennemi ?'},{c:'Ririte',x:'Mais oui, mais oui, les Norvégiens ! Il les a attirés par gourmandise en leur livrant des plats préparés pour les empoisonner.'},{c:'Liloute',x:'Non ? Des plats préparés ?',d:'même jeu'},{c:'Fifite',x:'Mais oui avec des norvégiennes !'},{c:'Liloute',x:'Non, des Norvégiennes ?'},{c:'Ririte',x:'Ils ont pris des femmes pour les cuisiner !'},{c:'Liloute',x:'Non ? Des femmes pour les cuisiner ?'},{c:'Fifite',x:'Et des hommes aux plats pour les épauler !'},{c:'Liloute',x:'Non ? Et des hommes aux plats pour les épauler ?'},{c:'Ririte',x:'Puis il les a trucidés.'},{c:'Liloute',x:'Non ? Il les a trucidés ?',d:'même jeu'},{c:'Fifite',x:'Bon, on va peut-être s’arrêter là ?'},{c:'Liloute',x:'Non ? on va s’arrêter là ?',d:'même jeu'},{c:'Ririte',x:'Ah ben non ! On se donne rendez-vous dans la forêt près du château d’Ilsemeur à la prochaine lune – pour annoncer nos prophéties à Macbeth et Banco.'},{c:'Liloute',x:'OK, mais dans quel quartier ?'},{c:'Fifite',x:'Et si on prenait le 1er quartier ?'},{c:'Liloute',x:'Moi, j’aurais préféré le dernier…'},{c:'Ririte',x:'Bon, on va prendre la pleine lune, comme ça, y’aura pas de jalouse !'},{c:'Liloute et Fifite',x:'Avec ces annonces à Macbeth, Comte de Glamis, et Banco, t’as pas peur qu’on provoque un désastre ?'},{c:'Ririte',x:'De toute façon, la lune, c’est déjà un des astres, alors ça change pas grand’chose…'},{c:'Liloute et Fifite',x:'En effet,'},{c:'Ririte',x:'Allez salut les filles !',d:'départ de bruit motorisé- balai'},{c:'Liloute et Fifite',x:'Salut',d:'départ de bruit motorisé- balai- même musique ? + transition'}]},
{id:'a1s2',label:'Acte I · Scène 2',title:'Des nouvelles du front pour le Roi Duncan',lines:[
{t:'stage',x:'Voix off- Présentateur/Présentatrice : Ecosse : pendant ce temps au Palais du Roi Duncan.'},{t:'stage',x:'Au Palais : Le roi Duncan attend les nouvelles en égrenant des raisins. Entrée de Malcolm.'},
{c:'Malcolm',x:'Je vous salue, mon Père, Roi Duncan.'},{c:'Duncan',x:'Bien Malcolm, mon petit, venons-en au rapport.'},{c:'Malcolm',x:'Eh bien, Mon Père, grâce aux manœuvres de Macbeth, Comte de Glamis, nous avons pu repousser l’ennemi ; ainsi les Norvégiens sont en fuite ou faits prisonniers.'},{c:'Duncan',x:'Prisonniers ou en fuite ? Très bon, très bon ; nous allons pouvoir enfin vivre en paix !'},{c:'Malcolm',x:'Sauf, Votre Majesté qu’avant notre assaut, un autre chevalier, le Comte de Cador nous a trahis en livrant le secret des plans de bataille de Macbeth et de Banco.'},{c:'Duncan',x:'Comment ? Le comte de Cador ? Quelle ingratitude ! Moi qui l’ai anobli Comte il y a peu ! Eh bien il sera « décomté » ; oui, Malcolm, désormais il sera simple soldat et sans titre pour solde de tout compte.'},{c:'Malcolm',x:'Ah, oui, quand même !'},{c:'Duncan',x:'Il gagnera mon déshonneur et perdra son titre de Comte de Cador- le plus haut rang de la chevalerie que je vais céder à quelqu’un de valeureux !'},{c:'Malcolm',x:'Ah oui ? Quelqu’un de valeureux, Père, Sire, Votre majesté ?',d:'y croyant'},{c:'Duncan',x:'Quelqu’un de confiance, avec qui je m’entretiens régulièrement ..'},{c:'Malcolm',x:'Ah oui quelqu’un avec qui vous vous entretenez régulièrement, Père, Sire, Votre Majesté. Bref quelqu’un qui est proche de vous, n’est-ce pas, Père, Sire, Votre Majesté ?'},{c:'Duncan',x:'Oui, en effet, quelqu’un qui est proche de moi, bien entendu ; c’est pourquoi ce titre je vais le transmettre à un chevalier dont je donnerai bientôt le nom.'},{c:'Malcolm',x:'Mais bien entendu, Père, Sire, Votre Majesté !',d:'mielleux, donnant des grains de raisin au Roi que celui-ci mange'},{c:'Duncan',x:'En attendant mon brave Malcolm, tu avertiras notre bon Arthur.'},{c:'Malcolm',x:'Arthur ?'},{c:'Duncan',x:'Oui Arthur H, notre bon bourreau.'},{c:'Malcolm',x:'Ah oui, ..évidemment, …bien entendu…, Père…Votre Majesté.'},{c:'Duncan',x:'Va et porte le message que notre Comte Cador sera déchu de son titre et qu’il perdra la tête.'},{c:'Malcolm',x:'Oui, évidemment, je n’y couperai pas. il va être déchu, j’espère que moi je n’ serai pas déçu !',d:'en aparté sur la seconde phrase'},{c:'Duncan',x:'Et maintenant lâche-moi la grappe, veux tu ?'},{c:'Malcolm',x:'Oui, bien entendu, Père, Sire, votre Majesté, vous avez raisin Sire, euh… vous avez raison Sire.'}]},
{id:'a1s3',label:'Acte I · Scène 3',title:'Un endroit dans la forêt',lines:scene3},
{id:'a1s4',label:'Acte I · Scène 4',title:'Au palais du Roi, Duncan concrétise la prophétie',lines:[
{t:'stage',x:'Musique royale - Retour au palais du Roi Duncan - Duncan est sur son trône.'},{c:'Duncan',x:'Ah vous voilà ! Valeureux chevaliers ! Entrez !'},{c:'Macbeth et Banco',x:'Bonjour votre majesté, Bonjour votre Majesté, Je salue votre Majesté,…',d:'se passent l’un devant l’autre plusieurs fois pour saluer'},{c:'Duncan',x:'Sachez que votre victoire sur la menace norvégienne renforce ma couronne.'},{c:'Macbeth',x:'Nous sommes à votre servi…'},{c:'Malcolm',x:'Père, votre Majesté, Banco, Macbeth,',d:'interrompant Macbeth'},{c:'Duncan',x:'Ah, mon fils Malcolm !'},{c:'Banco',x:'Non ! Mais il nous coupe la parole le fiston !'},{c:'Malcolm',x:'après avoir fait couper une tête, il m’est tout à fait facile de couper la parole.'},{c:'Macbeth',x:'Couper la tête ?'},{c:'Banco',x:'mais de qui?'},{c:'Duncan',x:'Du traître !'},{c:'Malcolm',x:'De ce renégat de Comte de Cador !'},{c:'Duncan',x:'Grâce à tes faits héroïques, ce titre désormais t’échoit, mon brave Macbeth.'},{c:'Macbeth',x:'Qui m’échoit ? Donc, j’ai pas l’choix.'},{c:'Duncan',x:'En effet à partir de ce jour, tu deviens titré au plus haut rang : tu es Macbeth, Comte de Cador !'},{c:'Malcolm',x:'Oui/Lui, Cador, tous les jours, un peu plus fort!',d:'déçu ; air de Oui j’ t’adore'},{c:'Banco',x:'Lui, Cador ça alors c’est un peu fort !',d:'suite de l’air de Oui j’ t’adore'},{c:'Macbeth',x:'Oui, Cador, c’était prédit dans mon sort !',d:'air de Oui j’ t’adore'},{t:'stage',x:'3 répliques qui peuvent être répétées - Duncan y met fin.'},{c:'Duncan',x:'Bien, bien, ne traînons plus, Macbeth, allez informer votre épouse de votre titre sur le champ et précisez que je veux vous honorer de ma visite en votre demeure.'},{c:'Macbeth',x:'Ainsi, les créatures-arbres rencontrées portaient-elles en elles un fruit de vérité ? Fruit de vérité, ou fruit défendu…Le pouvoir me tend les bras. Je dois en informer ma Lady, Lady Commandement.',d:'sortant, en aparté'}]},
{id:'a1s5',label:'Acte I · Scène 5',title:'Château d’Ilsemeur — annonce à Lady Macbeth',lines:[
{t:'stage',x:'Eclairs et orage. Lady Commandement est devant son miroir à rajuster sa coiffure.'},{t:'stage',x:'Un messager d’orange se présente. Sonneries (jingle orange).'},{c:'Lady Commandement',x:'Oui c’est quoi encore ? Pas moyen d’être tranquille !',d:'voix peu accueillante'},{c:'Messager',x:'Un message de la plus grande importance Madame…'},{c:'Lady Commandement',x:'Mme Lady Commandement, femme de Macbeth .'},{c:'Messager',x:'Donc ce message pour vous Lady Macbeth, c’est un SMS'},{c:'Lady Commandement',x:'Un SMS ?'},{c:'Messager',x:'Oui un service de messages secrets de la part de votre mari Macbeth.'},{c:'Lady Commandement',x:'Et pourquoi ton message ne serait pas un piège ?'},{c:'Messager',x:'Mais parce que…'},{c:'Lady Commandement',x:'Qu’est-ce qui me prouve que tu es un messager fiable ?'},{c:'Messager',x:'Eh bien, je peux….'},{c:'Lady Commandement',x:'Sur quels critères t’a-t-on recruté ?'},{c:'Messager',x:'Madame, je vous en prie, si vous voulez que je vous réponde, laissez-moi parler ?'},{c:'Lady Commandement',x:'Eh bien, parlez.'},{c:'Messager',x:'A condition de m’en donner l’occasion, à moi, employé d’Orange, laissez faire !'},{c:'Lady Commandement',x:'Faîtes vite !'},{c:'Messager',x:'Moi, Amy, Amy Serre, employé d’Orange, peux vous assurer que, je suis mandaté.e pour livrer des messages !'},{c:'Lady Commandement',x:'Et alors ?'},{c:'Messager',x:'Et alors, voici ce message, grâce à mon sens de la relation, car comme tous mes collègues, j’ai la fibre, voici donc',d:'remise du pli'},{c:'Lady Commandement',x:'Ca alors! Mon Macbeth, héros de la bataille contre les Norvégiens …. Promu Comte de Cador… Et le Roi Duncan qui nous fait l’honneur de sa visite… Voilà une opportunité inattendue !',d:'lisant ; dépose 1 pièce au messager puis lui fait signe de partir ; en aparté à partir de « Mon Macbeth »'},{c:'Lady Commandement',x:'Mais qu’est-ce que vous faîtes là ?',d:'découvrant A. Serre la main tendue'},{c:'Messager',x:'C’est-à-dire que la 1ère commission c’’était pour moi, mais la 2ème c’est pour mon supérieur, Votre Majesté…',d:'hésitant'},{c:'Lady Commandement',x:'Ah bon ? C’est qui votre supérieur ?'},{c:'Messager',x:'Vous devez le connaître, c’est Hubert.'},{c:'Lady Commandement',x:'Tiens, va pour Uber ! Et vous lui direz que c’est pour ses grosses commissions !',d:'va chercher quelque chose en pièce d’à côté et revient tenant un rouleau de PQ'},{c:'Messager',x:'Comptez sur moi, Lady Commandement.',d:'Il sort'}]},
{id:'a1s6',label:'Acte I · Scène 6',title:'Lady Co rêve du titre suprême',lines:[
{t:'stage',x:'Même pièce Château d’Ilsemeur - Nouveaux éclairs / tonnerre - Lady Co reprenant la lettre.'},{c:'Lady Commandement',x:'Duncan ici, dans notre demeure ! ….Viens Macbeth, toi promu Comte de Cador ! toi, que l’on prédit futur roi d’Ecosse ! Car oui, moi, Lady Commandement, toi qui m’appelles Lady Co, je saurai trouver les mots pour que tu gagnes le trône, même s’il faut user du pire ! Moi, Lady Co, je ne suis pas la rousse, mais rassure-toi j’ai mes Roberts.',d:'éclairs ; rire carnassier ; tâtant sa chevelure ; regard et mains sur la poitrine'},{c:'Lady Commandement',x:'J’en appelle aux forces du pouvoir et de l’ambition ; remplissez mes deux seins de fiel pour accomplir le dessein qui est le nôtre. Faîtes que Macbeth, mon mec à moi soit gagné par la force animale, sauvage ; faîtes qu’il devienne un lion rugissant, que mon Macbeth soit un vrai mec, une bête, un mec-bête quoi !'},{t:'stage',x:'Entre Macbeth.'},{c:'Macbeth',x:'Que dis-tu Lady Co ?'},{c:'Lady Commandement',x:'Ah, te voilà, ton message m’a transportée et je vois déjà l’avenir exister pour moi.',d:'musique royale + démarche'},{c:'Macbeth',x:'Ne t’emballe pas, tu sais que le roi arrive ce soir ?'},{c:'Lady Commandement',x:'Et quand part-il d’ici ?',d:'se sert à boire'},{c:'Macbeth',x:'Demain, c’est son projet.',d:'reçoit à boire de Lady C.'},{c:'Lady Commandement',x:'Et ne crois-tu pas que c’est pour nous le moment de l’accueillir comme il se doit … et même plus, afin qu’il ne reparte pas'},{c:'Macbeth',x:'Et même plus ?'},{c:'Lady Commandement',x:'Mais oui, aie l’air de la fleur innocente, mais sois le serpent caché dessous ; il faut pourvoir à la réception de notre roi…et profiter de l’occasion avant qu’on passe au grand ouvrage de cette nuit.'},{c:'Macbeth',x:'Au grand ouvrage…Hmm hmm… Nous en reparlerons.'}]}
,{"id": "a2intro", "label": "Acte 2 — Introduction", "title": "L’arme du crime", "lines": [{"t": "stage", "x": "Générique de téléachat. Scène type plateau télé- table de présentation avec couteau/ poignard/tronçonneuse – Voix off/ou présentateur/trice sur scène."}, {"c": "Présentateur", "x": "Vous hésitez souvent avant de prendre vos décisions ? Avec ce couteau vous pourrez trancher ! Idéal pour vos viandes crues ou cuites. N’attendez plus. Ce couteau est disponible dans toutes les boutiques Francis Lalame au prix de 40 livres."}, {"t": "stage", "x": "Musique."}, {"c": "Présentateur", "x": "Votre viande vous échappe ? Devenez maître de vos gigots, méchouis et cochonailles, saisissez –les grâce au poignard Cotrafic, avec le poignard Cotrafic, gardez votre festin en main pour de meilleurs lendemains ; Le poignard Cotrafic, l’arme royale par excellence, au prix de 70 livres ! Pour votre consommation…Et bien plus encore !"}, {"t": "stage", "x": "Musique."}, {"c": "Présentateur", "x": "Marre de passer un temps infini à découper cochons braisés, moutons rôtis ? Facilitez-vous la tâche grâce à la tronçonneuse DECHAINE, aucun os ne vous résistera, obtenez de belles tranches régulières. Pas d’effort nécessaire, coupez un bras, une jambe, tout ce que vous souhaitez, déchaînez-vous avec la tronçonneuse DECHAINE !"}, {"t": "stage", "x": "Musique."}]},
{"id": "a2s1", "label": "Acte 2 — Scène 1", "title": "Réception du Roi Duncan", "lines": [{"t": "stage", "x": "Macbeth et Lady Macbeth, dîte Lady Co soignent la réception du Roi Duncan- Salle de château Ilsemeure. Musique royale- arrivée de Duncan- encadrés de 2 gardes du corps- suivi de Malcom, Banco, Macduff et accueilli par Lady CO (démonstrative et mielleuse)."}, {"c": "Lady Commandement", "x": "Ah, Sire, notre roi à tous, quel honneur, mais quel honneur pour nous de vous accueillir en notre modeste demeure d’Ilsemeure- elle se prosterne et lui baise la main. Voyez combien on se fait un plaisir de vous accueillir au balcon !"}, {"c": "Duncan", "x": "En effet, je vois ça. (coup d’œil sur décolleté de Lady Co). Mais dîtes-moi, où est votre valeureux mari chevalier, nouvellement promu Comte de Cador ?"}, {"c": "Lady Commandement", "x": "Il se prépare, Sire, il se prépare Sire, vous savez pour nous c’est une grande soirée, nous n’avons pas de temps à tuer (aparté enfin, pas tout de suite…) tout doit être planifié à la seconde près !"}, {"c": "Duncan", "x": "Allons , Lady Commandement, n’exagérons rien !"}, {"t": "stage", "x": "Cette dernière ouvre ensuite la marche tout en se déhanchant."}, {"c": "Présentateur", "x": "Sa majesté Le Roi Duncan, Roi en charge du Royaume d’Ecosse …."}, {"t": "stage", "x": "Arrivée de quelques pages (enfants) pour présenter de plats que les gardes du corps vont « ausculter »."}, {"c": "Présentateur", "x": "Pour régaler le palais de sa Majesté voici le menu de la soirée :"}, {"c": "Page 1", "x": "Pavé de saumon lancé des barricades norvégiennes"}, {"c": "Page 2", "x": "Traduction : A piece of fish tired from the barrières of the omelettes"}, {"c": "Duncan", "x": "Tired from the omelettes ?"}, {"c": "Page 1", "x": "Son Altesse, en cuisine on traduit norvégien/ne par omelette"}, {"c": "Duncan", "x": "Bien, dans ce cas-là, grâce à notre victoire, nous associerons les 2 : « Omelettes et Norvégiennes », nous parlerons d’omelettes norvégiennes."}, {"c": "Page 2", "x": "(prenant sa respiration et annonçant lentement) Faux filet…"}, {"t": "stage", "x": "A ces mots , le Roi et sa suite prennent la sortie."}, {"c": "Lady Commandement", "x": "Mais, mais …Son Altesse et vous tous, pourquoi partez-vous ?"}, {"c": "Macduff", "x": "N’avez-vous pas entendu « Faut filer »"}, {"c": "Malcolm", "x": "En effet, c’est tout à fait cela, Père."}, {"c": "Page 2", "x": "(reprenant) Plat de résistance Faux filet de bovin"}, {"c": "Page 3", "x": "wrong filet of « meuh »"}, {"c": "Page 2", "x": "Pommes de terre braisées"}, {"c": "Page 3", "x": "potatoz cuisined in Bretagne"}, {"c": "Page 3", "x": "Et pour terminer, votre Altesse, la crème de la crème pour le dessert, La Ronde des Prénoms :"}, {"c": "Page 1", "x": "Charlotte aux fraises- (chanté) Strawberry fields for ever"}, {"c": "Page 2", "x": "Avec des madeleines – (chanté) Ce soir j’attends des Madeleines/ Tonight I’m waiting for Madeleine"}, {"c": "Page 3", "x": "Façon Poire-Belle Hélène- (chanté) Hélène my name is Hélène"}, {"c": "Page 1", "x": "Le tout arrosé d’un Crémant de Loire"}, {"c": "Page 2", "x": "oui, en fait, il s’agit d’un Crémant autrefois classé"}, {"c": "Page 3", "x": "Autrement dit, le tout arrosé d’un ex-Crémant !"}, {"c": "Lady Commandement", "x": "(en aparté) Autant dire au Roi qu’on va lui faire bouffer d’la merde !"}, {"t": "stage", "x": "Musique : Lady Co invite le Roi et sa suite à passer à table (en coulisses). Retour de Lady Co."}, {"c": "Lady Commandement", "x": "Mais qu’est-ce qui m’a foutu des p’tits cons de traducteurs pareils !"}, {"c": "Pages 1 2 3", "x": "On n’est pas des p’tits cons ! On nous avait dit que le Roi ne comprenait pas notre langue."}, {"c": "Lady Commandement", "x": "Le Roi peut-être – bon, le public ne comprend pas, sans doute ; même les traductions ils ne sont pas sûrs d’avoir compris."}, {"c": "Pages 1 2 3", "x": "C’est vraiment trop injuste !"}, {"c": "Lady Commandement", "x": "Puisque c’est ainsi, vous serez tous traduits"}, {"c": "Pages 1 2 3", "x": "Traduits ?"}, {"c": "Lady Commandement", "x": "traduits en justice"}, {"c": "Pages 1 2 3", "x": "(en sortant) Quand je pense que c’est Lady co qui va traduire des pages en justice !"}]},
{"id": "a2s2", "label": "Acte 2 — Scène 2", "title": "Bientôt l’heure du « grand ouvrage »", "lines": [{"c": "Présentateur", "x": "La réception du Roi Duncan se déroule comme prévu ; le Roi profite de la présence de ses valeureux chevaliers…"}, {"t": "stage", "x": "Macbeth entre sur scène – Bruits de banquet en paysage sonore de fond."}, {"c": "Macbeth", "x": "Duncan chez moi, pour fêter ma promotion- Comte de Cador ; je luis dois déjà ce titre… et si les sorcières disaient vrai !"}, {"c": "Lady Commandement", "x": "Eh Mac, on t’attend, le saumon est servi"}, {"c": "Macbeth", "x": "J’arrive ma Lady Co…mais je repense et m’interroge sur notre grand ouvrage…"}, {"c": "Lady Commandement", "x": "Grand ouvrage qui va nous ouvrir les portes du Royaume, pour un avenir plein de promesses."}, {"c": "Macbeth", "x": "J’aimerais déjà y être, mais sans avoir à perpétrer le grand ouvrage."}, {"c": "Lady Commandement", "x": "(plus câline) De quoi t’inquiètes-tu mon Mac ? En alcoolisant les deux gardes, on passera à l’ouvrage facilement !"}, {"c": "Macbeth", "x": "Il n’empêche, sans Duncan, jamais je n’aurais eu ce titre."}, {"c": "Lady Commandement", "x": "Justement, te voilà Cador ! Réveille la bête qui est en toi ! (le secouant tendrement) Deviens mon Macbeth ! Mon lion enragé !"}, {"c": "Macbeth", "x": "Ah oui ?"}, {"c": "Lady Commandement", "x": "Oh, oui !, Mon Macbeth, Ma bête, mon mec, Macbeth !"}, {"c": "Macbeth", "x": "Oh oui ! Ton Macbeth, oh oui !"}, {"t": "stage", "x": "Son générique - Goldwynn Major ?"}, {"c": "Lady Commandement", "x": "Cette nuit, nous allons changer de rang et devenir grand !"}, {"c": "Macbeth", "x": "Oh, oui ! Oh oui ! (un temps)... Mais comment allons-nous procéder ? Quelle arme allons-nous utiliser ?"}, {"c": "Lady Commandement", "x": "(générique téléachat) - Grâce au Téléachat( à voir), j’ai déjà tout anticipé, mon Mac !"}, {"c": "Macbeth", "x": "La tronçonneuse ?"}, {"c": "Lady Commandement", "x": "trop bruyante"}, {"c": "Macbeth", "x": "Le hachoir ?"}, {"c": "Lady Commandement", "x": "trop lourd à manœuvrer !"}, {"c": "Macbeth", "x": "Le couteau ?"}, {"c": "Lady Commandement", "x": "Voilà ce qu’il nous faut ! Bien vu mon Mac, t’es une bête !"}, {"c": "Macbeth", "x": "Oh, oui ! (re-Goldwynn Meyer !) - En route pour le saumon !"}, {"c": "Lady Commandement", "x": "et l’omelette norvégienne !"}, {"t": "stage", "x": "Transition musicale (bruit de repas prolongé + échanges….)- Musique type Lully/ Rameau. Puis voix en coulisses."}, {"c": "Duncan", "x": "Mon brave Macbeth, désormais Comte de Cador, je vous remercie pour cette merveilleuse soirée."}, {"c": "Macbeth", "x": "Le bonsoir, Roi Duncan, merci Sire pour votre visite"}, {"c": "Duncan", "x": "Il est temps pour moi de regagner ma couche"}, {"c": "Lady Commandement", "x": "Votre Majesté, on vous souhaite une longue nuit !"}, {"c": "Macbeth", "x": "Longue nuit d’un sommeil profond, votre Altesse !"}, {"c": "Duncan", "x": "Voilà ce qui s’appelle un vœu pieu !"}, {"t": "stage", "x": "Musique - Transfert de Duncan, accompagné des 2 gardes (mise en place décor). Mise en place d’un lit sur roulettes+ baldaquin (drap transparence ombres chinoises pour déshabillage roi +arrivée des 2 gardes. – Ronflements."}]},
{"id": "a2s3", "label": "Acte 2 — Scène 3", "title": "L’heure du crime", "lines": [{"t": "stage", "x": "La scène est dans la pénombre."}, {"c": "Garde 1", "x": "Crois-tu que notre Roi dort ? (temps de silence- rot/hoquet des gardes)"}, {"c": "Garde 2", "x": "T’as repris du saumon 2 fois , toi ?"}, {"c": "Garde 1", "x": "Un peu, mon neveu, plutôt 2 fois qu’une, pour une fois qu’on peut manger à l’œil. (Hoquet/remontée gastrique) A tel point que mon saumon remonte le courant."}, {"c": "Garde 2", "x": "Moi aussi, garde 1, j’ai comme qui dirait, mal au cœur… (silence)"}, {"c": "Garde 1", "x": "(réfléchissant) Tiens toi aussi, … (un temps) on t’identifie par garde 2 ?"}, {"c": "Garde 2", "x": "Oui, Garde 1, y’ avait pas l’budget pour nous identifier !"}, {"c": "Garde 1", "x": "Toujours pareil !... On m’a simplement dit, dans ton rôle ce sera « Garde la nuit »."}, {"c": "Garde 2", "x": "Moi aussi ! Quand j’ai postulé, c’était plutôt « Retiens la nuit »"}, {"c": "Garde 1", "x": "Retiens la nuit ! J’en jaunis à l’idée !"}, {"c": "Garde 2", "x": "(pris de hauts-le-coeur ) A propos de jaunir ; j’ai le saumon qui remonte à l’embouchure."}, {"c": "Garde 1", "x": "Moi aussi, sans compter la Charlotte, la Madeleine et la Belle Hélène qui s’bousculent au portillon."}, {"c": "Garde 2", "x": "Et si je repense aux fleurs, ça me donne la gerbe !"}, {"c": "Garde 1", "x": "(suffoquant) : N’en rajoute pas, mais j’vois pas ce que les fleurs viennent faire la –dedans ?"}, {"c": "Garde 2", "x": "Moi, j’étais pas loin du bouquet- et ça sentait pas la rose, j’t’assure."}, {"c": "Garde 1", "x": "Evidemment, la majorité étaient pourries et noyées ! Et importées en plus !"}, {"c": "Garde 2", "x": "Ça venait d’où ?"}, {"c": "Garde 1", "x": "Un surplus des Floralies, paraît-il. Là je n’tiens plus, direction les latrines !"}, {"c": "Garde 2", "x": "Deuze ! Ne réveille pas notre Majesté, je monte la garde."}, {"c": "Garde 1", "x": "(Pouce levé pour OK)"}, {"t": "stage", "x": "Silence…puis pas résonnants dans couloir G2 se déplace vers origine du bruit, oreille tendue- puis revient se poster. Bruit de liquide dans cuvette. Expression de dégoût –et haut-le –cœur de Garde 2. Bruit de pas à nouveau. G2 revient vers entrée, prêt –arme en main (matraque) G1 entre- mais avec une capuche- G2 le suit sur quelques pas dans la pénombre G1 se retourne."}, {"c": "Garde 2", "x": "Qui va là ?"}, {"t": "stage", "x": "A sa vue G1 s’évanouit."}, {"c": "Garde 2", "x": "Après avoir vomi, on s’évanouit, eh bien merci. (il s’agenouille pour le réveiller= claques/ …) Quelle idée de mettre une cagoule ! (Sur ce, arrive Lady Co)"}, {"c": "Lady Commandement", "x": "La bonne nuit, gardes … ah , je vois que votre collègue est indisposé ?"}, {"c": "Garde 2", "x": "C’est-à-dire, Lady Commandement…"}, {"c": "Lady Commandement", "x": "Comtesse, désormais je suis Comtesse de Cador"}, {"c": "Garde 2", "x": "Oui , évidemment, … Comtesse de Cador, on a un peu abusé du saumon, des desserts."}, {"c": "Lady Commandement", "x": "Non ?... J’ai ce qu’il vous faut pour apaiser ces vilains maux ; (sortant une fiole) c’est léger et ça nettoie. N’hésitez pas, une bonne dose !"}, {"c": "Garde 2", "x": "(reniflant puis ingurgitant, il est ensuite pris de soubresauts) Voilà un remède royal"}, {"c": "Lady Commandement", "x": "En effet, royal, c’est le terme approprié. A votre collègue, à présent."}, {"t": "stage", "x": "G2 s’exécute, lui ingurgite une bonne dose, G1 se remet assis avec mêmes effets…"}, {"c": "Garde 1", "x": "Ah, mais où suis-je ?"}, {"c": "Lady Commandement", "x": "A la garde du Roi Duncan ; vous pouvez terminer, et partagez ce qu’il reste. (ils s’exécutent)."}, {"c": "Garde 1", "x": "Ah oui, (revenant à lui et regardant garde 2) , ça nettoie"}, {"c": "Garde 2", "x": "Si, si c’est bien moi"}, {"c": "Garde 1", "x": "(reprenant une rasade, puis retombant dans un demi-sommeil) Non, j’te dis, ça nettoie."}, {"c": "Garde 2", "x": "(idem dans un ½ sommeil) Mais c’est bien moi."}, {"t": "stage", "x": "Possible en boucle jusqu’à sommeil profond + ronflements. Lady Co les regarde et se montre satisfaite. Arrive Macbeth, surpris à la vue des gardes."}, {"c": "Macbeth", "x": "Tu les as déjà occis, Lady Co ?"}, {"c": "Lady Commandement", "x": "ça a même été plus facile que je ne pensais ; ces crétins se sont tellement empiffrés et avaient tellement bu qu’ils étaient déjà bien atteints !"}, {"c": "Macbeth", "x": "C’est donc l’heure ?"}, {"c": "Lady Commandement", "x": "Eh oui, Macbeth, vas-y mon Mac, ma bête ( elle lui donne une autre fiole). Tiens, donne-toi du courage ! Le royaume est à nous !"}, {"c": "Macbeth", "x": "Le royaume est à nous !"}, {"t": "stage", "x": "Macbeth passe derrière le drap et on voit son ombre poignarder Duncan-musique et revient taché de sang."}, {"c": "Lady Commandement", "x": "Bravo ! Macbeth, t’es une bête !"}, {"c": "Macbeth", "x": "(ressort, hagard) Ca y est c’est fait… tu crois que j’ai bien fait ?"}, {"c": "Lady Commandement", "x": "(le débarrassant du couteau et badigeonnant les mains des gardes- mettant l’arme entre leurs mains) Evidemment que tu as bien fait !"}, {"c": "Macbeth", "x": "Oui, mais tu sais, Duncan était un bon roi !"}, {"c": "Lady Commandement", "x": "Mais toi aussi, tu seras un bon roi, Macbeth, ma bête !"}, {"c": "Macbeth", "x": "Et si on découvrait notre crime ?"}, {"c": "Lady Commandement", "x": "Tu rigoles, avec ces indices, l’arme, les taches, le sang."}, {"c": "Macbeth", "x": "Oui, mais c’est quand même malheureux"}, {"c": "Lady Commandement", "x": "Comment ça ?"}, {"c": "Macbeth", "x": "Tant de sang royal versé"}, {"c": "Lady Commandement", "x": "Maintenant c’est nous, le sang royal."}, {"c": "Macbeth", "x": "( Un temps )Oui, mais tu te rends compte, Duncan était d’un groupe rare O-."}, {"c": "Lady Commandement", "x": "Mais nous aussi, nous sommes d’un groupe rare."}, {"c": "Macbeth", "x": "Je parle du groupe sanguin."}, {"c": "Lady Commandement", "x": "Tu parles pour quelques centilitres au plus…."}, {"c": "Macbeth", "x": "Non O-, je te dis. Et puis j’ai entendu les sœurs sorcières me souffler : « Macbeth a tué le sommeil ! »."}, {"c": "Lady Commandement", "x": "Eh bien justement, il est l’heure ; allons-nous cacher et nous coucher"}, {"t": "stage", "x": "Macbeth reste immobile et hagard."}, {"c": "Lady Commandement", "x": "Allez viens, que j’aille me laver les mains pour effacer toute trace de notre ouvrage."}, {"c": "Macbeth", "x": "(hagard) Notre ouvrage peut être découvert, tu le sais bien, ne te voile pas la fesse !"}, {"c": "Lady Commandement", "x": "(riant) Oh que si, que je vais me voiler la FACE, FACE mon mec-bête! Il est temps que tu ailles au lit…"}, {"c": "Macbeth", "x": "A condition que le sommeil arrive… (il sort)."}, {"t": "stage", "x": "Noir- Bruits nocturnes-ronflements gardes. Macbeth rerentre toujours hagard."}, {"c": "Macbeth", "x": "Et si les gardes découvraient notre ouvrage….ces deux-là sont de trop. (il reprend le couteau et les assassine machinalement)…(s’apprête à sortir puis revient sur ses pas…) . Merde, j’aurais dû vérifier qu’ils n’étaient pas du groupe O-..."}]},
{"id": "a2s4", "label": "Acte 2 — Scène 4", "title": "Découverte du crime", "lines": [{"t": "stage", "x": "Lumière naissante- pénombre. Lumière qui s’intensifie graduellement et un coq (déguisement) apparaît et se lance pour un Cocorico… mais s’arrête faute de souffle…Puis reprend pour un Cocorico poussif et souffle à nouveau… Enfin, il se lance pour un Cocorico sous forme de « Bê, bê, bê, bê, bê ! »… Le jour se lève petit à petit."}, {"c": "Macduff", "x": "(rentrant dans la pénombre, dos au lit royal) Buen Giorno, good morning, buenos dias, guten tag, bonjour, votre majesté, vostra maestà, your majesty, su majesta, eure majestät, …"}, {"c": "Garde 1", "x": "il est con, ou quoi, pourquoi faire tout ce charabia ?"}, {"c": "Garde 2", "x": "Faut toujours qu’il se fasse remarquer !"}, {"c": "Macduff", "x": "il est l’heure, es ist Zeit, it is team"}, {"c": "Garde 2", "x": "(le corrigeant) « time »"}, {"c": "Macduff", "x": "oui, on va pas chipoter, « it is time », e il momento, (dit mo-men-to et non momène-to)"}, {"c": "Garde 2", "x": "( corrigeant) « moméne-to »"}, {"c": "Macduff", "x": "Oh, ça suffit, à ce que je sache vous n’êtes pas les gardiens de la langue."}, {"c": "Gardes 1 2", "x": "(en chœur) Non, on est gardes tout court."}, {"c": "Macduff", "x": "Oui, et morts aussi !"}, {"c": "Gardes 1 2", "x": "(se regardant) Ah, oui, c’est exact. (retombant en position « mort »)"}, {"c": "Macduff", "x": "(reprenant son rôle) Il est l’heure, Votre Majesté… Allons Majesté, vous avez vraiment un sommeil de plomb ! (se retourne et revient vers lit royal et découvre la macabre scène). Oh, horreur ! Horreur !"}, {"c": "Malcolm", "x": "(des coulisses) Allons, que se passe-t-il ?"}, {"c": "Macduff", "x": "Si tu savais, quelle désolation !"}, {"c": "Malcolm", "x": "Le Pen a pris le pouvoir ?"}, {"c": "Macduff", "x": "C’est aussi tragique !"}, {"c": "Malcolm", "x": "Mélenchon est devenu 1er Ministre !"}, {"c": "Macduff", "x": "(revenant vers le lit royal) Mais non, voyons, on vient d’assassiner ton père Le Roi Duncan."}, {"c": "Malcolm", "x": "(entrant, puis découvrant la scène) Ah, mon Dieu ! Mais enfin, qui a pu vouloir mettre fin à sa vie de manière aussi cruelle ?"}, {"c": "Macduff", "x": "Regarde les gardes sont couverts de sang et les couteaux semblent témoigner de leur crime."}, {"t": "stage", "x": "Un temps- ce qui suit est sur l’air de « Le Lion est mort est ce soir »."}, {"c": "Macduff", "x": "Ouéah"}, {"c": "Malcolm", "x": "Ouéah"}, {"c": "Macduff", "x": "Ouéah"}, {"c": "Malcolm", "x": "Ouéah"}, {"c": "Macduff + Malcolm", "x": "Dans son lit, son tout petit lit\nOn a tué le Roi cette nuit\nOn a voulu mett’fin à sa vie\nOn a tué le Roi cette nuit"}, {"c": "Gardes 1 2", "x": "(se relevant) Ah ou- ou – ou wimboé (puis retombant)."}, {"c": "Malcolm", "x": "(sortant) Je ne peux rester une seconde de plus ici !"}]},
{"id": "a2s5", "label": "Acte 2 — Scène 5", "title": "Découverte du crime (suite)", "lines": [{"t": "stage", "x": "Lady Co et Macbeth rentrent."}, {"c": "Macbeth", "x": "Ah, mon Dieu !"}, {"c": "Lady Commandement", "x": "Ah, mon Dieu ! (exagérant)"}, {"c": "Macbeth", "x": "Qu’est-il arrivé ?"}, {"c": "Lady Commandement", "x": "Oui, qu’est-il arrivé ? (exagérant)"}, {"c": "Macduff", "x": "On a tué notre bon Roi Duncan !"}, {"c": "Gardes 1 2", "x": "(se relevant) Ah ou- ou – ou wimboé (puis retombant)."}, {"c": "Macduff", "x": "et ses gardes aussi"}, {"c": "Macbeth", "x": "Mais, comment est-ce possible ?"}, {"c": "Lady Commandement", "x": "Et Malcom où est-il ?"}, {"c": "Macduff", "x": "il n’a pas pu rester une minute de plus, et vient de partir."}, {"c": "Lady Commandement + Macbeth", "x": "Comment ?"}, {"c": "Lady Commandement", "x": "Voilà qui est bizarre…"}, {"c": "Macbeth", "x": "Bizarre, en effet, bizarre.."}, {"c": "Macduff", "x": "En attendant, restons sur nos gardes, car l’assassin ou les assassins sont peut-être parmi nous… (il sort)"}, {"c": "Lady Commandement", "x": "Tu as entendu, mon Mac, ma bête"}, {"c": "Macbeth", "x": "Oui, … plus que jamais, restons sur nos gardes. (ils sortent)."}, {"c": "Garde 1", "x": "Tu as entendu, restons sur nos gardes."}, {"c": "Garde 2", "x": "Oui, restons sur NOS GARDES…"}, {"c": "Gardes 1 2", "x": "(se regardant) Sur nos gardes ? Ah non !"}, {"t": "stage", "x": "Noir. On entend la voix de Macbeth qui appelle le coq en criant avec autorité."}, {"c": "Macbeth", "x": "Dis donc l’coq, viens ici tout de suite, tout de suite, j’ai dit !"}, {"c": "Coq", "x": "(qui apparaît milieu de scène par un poursuite focalisée sur lui, face public, comme pour un tribunal) Oui, Sire, vous avez vu, j’ai poussé mon cri comme vous l’avez demandé."}, {"c": "Macbeth", "x": "Tu parles d’un cri ! A cause de toi, je suis arrivé en retard, triple idiot ! Qu’est-ce qui m’a foutu un coq aussi faiblard !"}, {"c": "Coq", "x": "J’y peux rien, moi, déjà, je suis cuit, alors !"}, {"c": "Macbeth", "x": "T’es cuit ! C’est pas une raison pour faire un « Bê ! bê » au lieu d’un cocorico !"}, {"c": "Coq", "x": "J’vous l’dis, j’suis cuit ! J’suis un coq au vin ! Donc j’peux pas faire autrement qu’un « Bê ! »"}, {"c": "Macbeth", "x": "Un coq ovin qui fait « bê », on aura tout vu ! Allez, approche-toi ! (Le coq s’avance un peu avec des « bê… bê » timides) ; enfin, comment t’as pu en arriver là !?"}, {"c": "Coq", "x": "Vous savez, moi j’ai été élevé comme un coq sportif, sauf que j’ai perdu mon Cocorico quand j’ai côtoyé un coq paraguayen !"}, {"c": "Macbeth", "x": "De mieux en mieux ! Je veux un coq, moi, Macbeth, Roi d’Ecosse, un vrai coq ! Tu vas donc finir grillé ! A la casserole !"}, {"c": "Coq", "x": "Non, non ! S’il vous plaît, Votre Majesté ! J’ai une solution de remplacement, un coq, un vrai !"}, {"c": "Macbeth", "x": "Ah, oui ? … Et c’est quoi, cette solution !"}, {"c": "Coq", "x": "Un vrai coq, j’vous l’dis ! Qui sait gérer ! C’est le Coq Des Champs !"}, {"c": "Macbeth", "x": "Bon, te voilà en sursis, Coq au vin et va pour le Coq Des Champs !"}, {"t": "stage", "x": "A sa sortie, on entend un cri d’agonie, et Macbeth qui revient dans le halo."}, {"c": "Macbeth", "x": "Le voilà cuit pour de bon ! Place au coq Des champs !"}, {"t": "stage", "x": "NOIR"}]},
{"id": "a3s1", "label": "Acte 3 — Scène 1", "title": "Flash info BINEWS", "lines": [{"t": "stage", "x": "Plateau télé - Générique journal."}, {"c": "Présentateur", "x": "Flash info spécial sur BINEWS. On nous annonce la mort dans l’âme que lame d’un cou- teau-tôt ce matin (il se reprend)\nQue la lame d’un couteau, tôt ce matin, a transpercé le cœur de notre bon Roi Duncan.\nA l’heure où je vous parle ( H, Min, S), nous n’en savons liquide pas plus (il se reprend), nous n’en savons pas plus sur son pilote décès (il se reprend) sur son décès. Selon nos reporters, et mer… selon nos reporters, son fils Mal-com- édie étant en fuite… son fils Malcom étant en fuite, le dénommé Macbeth, Comte de Cador devrait rejoindre les WC sous peu… euh, le dénommé Macbeth devrait rejoindre le trône sous-peu à la grimace,…. devrait rejoindre le trône sous peu.\nOn nous révèle aussi que le couple royal devrait bientôt recevoir la basse-cour « ces œufs »…devrait bientôt inviter la cour chez eux, au château d’Ilsemeur\nLorsque la corne m’use, j’écoute Binews, à très vite pour notre prochain flash !\nVoilà, vive l’Ecosse… de batterie, vive notre bon roi Duncan!...euh notre « futur »roi Macbeth !"}]},
{"id": "a3s2", "label": "Acte 3 — Scène 2", "title": "Un crime organisé", "lines": [{"t": "stage", "x": "Macbeth missionne des tueurs à gage. 2 « agents » masqués (haut noir et pantalons écossais) entrent sur scène à reculons, regardant autour d’eux sans se voir et finissent par se toucher (surpris)."}, {"c": "AG1", "x": "ah ! tu m’as fait peur"}, {"c": "AG2", "x": "Eh toi, t’aurais pu faire attention !"}, {"c": "AG1", "x": "Je faisais justement attention. (Un temps)"}, {"c": "AG2", "x": "je te donne le mot « 2 passes »."}, {"c": "AG1", "x": "Non, c’est 2 passes"}, {"c": "AG2", "x": "Donc on est bien d’accord, le code c’est « 2 passes »."}, {"c": "AG1", "x": "Ok, c’est le mot « 2 passes »."}, {"c": "AG2", "x": "Bon, qu’est ce que tu fous avec ce pantalon ?"}, {"c": "AG1", "x": "Quoi ? Qu’est-ce qu’il a mon pantalon ?"}, {"c": "AG2", "x": "T’as pas vu que les poches de derrière sont devant ?"}, {"c": "AG1", "x": "Et alors ? T’as pas compris qu’ainsi, j’aurai pas besoin de m’retourner pour pisser !"}, {"c": "AG2", "x": "Ah, bon … et tu l’as trouvé où ?"}, {"c": "AG1", "x": "Allons, je l’ai fait venir en kit !"}, {"c": "AG2", "x": "Ah ouais, pas con… faire venir un pantalon en kit."}, {"t": "stage", "x": "Macbeth arrive."}, {"c": "Macbeth", "x": "Notre mot"}, {"c": "AG1 + AG2", "x": "« 2 passes »."}, {"c": "Macbeth", "x": "(rassuré) : Bien, je vois que le secret a été bien gardé . (Les mettant dans la confidence). Je vais vous mandater pour une lourde tâche."}, {"c": "AG1 + AG2", "x": "Ah bon ? Une lourde tâche ?"}, {"c": "Macbeth", "x": "Vous avez compris que Banquo vous veut du mal ? ( en aparté ) et ses enfants sont censés prendre ma place… en tant que roi, il est une menace,\nAurais-je tué Duncan pour que ses enfants en profitent !"}, {"c": "AG1", "x": "Qu’est-ce que vous voulez dire , Sire ?"}, {"c": "Macbeth", "x": "Allons, ce que vous avez découvert hier lors de notre rencontre ?"}, {"c": "AG2", "x": "Ah oui, que nous étions un lointain parent de Banquo (AG1 acquiesce)."}, {"c": "AG1", "x": "Et même que vous avez dit, que nos ancêtres étaient pas « fute, fute »"}, {"c": "AG2", "x": "(s’amusant entre eux) Eh, oui, et comme ils étaient pas fute fute, ils sont passés au kilt"}, {"c": "AG1", "x": "(riant de plus belle) Pas cons, quand même, c’est peut-être eux qui l’ont inventé !"}, {"c": "Macbeth", "x": "(s’emportant, et impressionnant AG1 AG2) : Ecoutez, bande d’idiots, j’ai aussi parlé de la misère et la pauvreté que Banquo a pu provoquer dans vos familles."}, {"c": "AG1", "x": "(naïf) Ah oui, ça c’est vrai aussi, vous l’avez dit Sire."}, {"c": "AG2", "x": "(s’appesantissant sur leur sort) Oui, quand je pense à la masure dans laquelle mes aïeuls et mes parents vivaient !"}, {"c": "AG1", "x": "Moi, pareil, c’était pas une masure, c’était un taudis"}, {"c": "AG2", "x": "Et c’était pas Le Roi de l’époque qui les a aidés ! (Macbeth s’agace)"}, {"c": "AG1", "x": "Oh, non ! Pour les aider à réparer, il aurait fallu un…."}, {"c": "AG2", "x": "Un Leroy Merlin ! (AG2 AG1 se marrent ensemble)"}, {"c": "Macbeth", "x": "Ca suffit ! Donc vous vous rendez compte du tort que Banquo a pu vous causer ?"}, {"c": "AG1 + AG2", "x": "Oh, oui …"}, {"c": "Macbeth", "x": "Donc le seul moyen d’enrayer cette spirale est de vous venger en éliminant Banquo ?"}, {"c": "AG1 + AG2", "x": "En éliminant Banquo ?"}, {"c": "AG1", "x": "Ah oui, quand même !"}, {"c": "AG2", "x": "Ca rigole pas ."}, {"c": "Macbeth", "x": "(redevenant plus mielleux) Enfin, vous allez le supprimer, gentiment, calmement."}, {"c": "AG1", "x": "Gentiment."}, {"c": "AG2", "x": "Calmement."}, {"c": "Macbeth", "x": "J’ai invité Banquo à mon banquet d’intronisation ; il doit donc se présenter ici avant ce soir."}, {"c": "AG1", "x": "(répétant comme pout mémoriser) Banquo invité…"}, {"c": "AG2", "x": "(comme pour compléter) Pour un banquet"}, {"c": "Macbeth", "x": "Dès son arrivée, il faudra le faire disparaître"}, {"c": "AG1", "x": "(même jeu) Banquo arrivé"}, {"c": "AG2", "x": "Faire disparaître"}, {"c": "Macbeth", "x": "Mais vous veillerez à ne pas laisser de trace."}, {"c": "AG1", "x": "Faudra qu’on fasse le ménage, sire ?"}, {"c": "AG2", "x": "Et qu’on enlève nos chaussures, Sire ?"}, {"c": "Macbeth", "x": "(exaspéré) Vous vous débrouillez et surtout, tenez-moi au courant, une fois votre tâche exécutée. ( il quitte la scène)"}, {"c": "AG1", "x": "Il est pas commode, le Roi Macbeth !"}, {"c": "AG2", "x": "Dis, donc, comment qu’on va faire ?"}, {"c": "AG1", "x": "Beh oui, comment qu’on va faire ?"}, {"t": "stage", "x": "AG1- AG2 : Tous deux se regardent d’un air dubitatif…"}]},
{"id": "a3s3a", "label": "Acte 3 — Scène 3", "title": "Scène d’installation", "lines": [{"t": "stage", "x": "Passage à la pénombre+ musique d’ambiance. Décor de sous-bois- buisson (côté cour (et/ou), jardin). Banquo arrive en se tordant, comme s’il était pris de coliques ou problèmes gastriques. Il profite des buissons pour faire ses besoins= passe derrière pour se soulager, après avoir remis son kilt et sous-vêtement en bouchon) sur le buisson. Un des agents passe alors et éternue à répétition, voyant le tissu en bouchon, il s’en sert pour se moucher et l’emporte. On voit ensuite Banquo tâtonner pour retrouver ses effets. En parallèle une main lui tend du PQ."}, {"c": "Banco", "x": "Merci bien, voilà qui permettra d’éviter toute trace."}, {"t": "stage", "x": "Il reprend son kilt sur le buisson puis réapparaît debout et, jetant un coup d’œil réalise qu’on lui a remis du papier… Ne comprend pas. C’est alors que réapparaît son sous-vêtement (agité des coulisses)."}, {"c": "Banco", "x": "C’est vous qui aviez pris mon slip ?"}, {"t": "stage", "x": "Il se dirige vers coulisses, on entend un « ah » de douleur= Banquo a été transpercé par une lance."}, {"c": "AG1", "x": "(ressortant des coulisses avec 1 bout de lance qui transperce Banquo au niveau de la ceinture, AG1 est à une extrémité, AG2 à la 2ème) Déjà, on dit « sous-vêtement »"}, {"c": "AG2", "x": "Nous, on est censé pas laisser de trace, alors.."}, {"c": "Banco", "x": "Mais pourquoi tant de haine ?"}, {"c": "AG2", "x": "Nous on est censé obéir aux ordres ?"}, {"c": "Banco", "x": "Aux ordres, mais aux ordres de qui ?"}, {"c": "AG2", "x": "Demande à mon collègue."}, {"c": "Banco", "x": "Tu parles, je ne le vois pas ; il me tourne le dos."}, {"t": "stage", "x": "Par le biais de la ceinture AG1 et AG2 font un demi-cercle , ce qui fait crier/ hurler Banquo de douleur et AG1 se retrouve ainsi face à Banquo, de + en + agonisant."}, {"c": "Banco", "x": "Vous obéissez aux ordres de qui ? ( s’écroule)."}, {"c": "AG1", "x": "Et voilà !"}, {"c": "AG2", "x": "Ca, c’est fait"}, {"c": "AG1", "x": "Et le corps ?"}, {"c": "AG2", "x": "Ah ben oui, comment qu’on fait ?"}, {"t": "stage", "x": "Noir."}]},
{"id": "a3s3b", "label": "Acte 3 — Scène 3", "title": "Un étrange dîner", "lines": [{"t": "stage", "x": "Musique ambiance royale. VOIX OFF : « Ce soir Son Altesse Le Roi Macbeth célèbre le début de son règne par un dîner ». Macbeth et Lady CO se préparent."}, {"c": "Macbeth", "x": "J’espère que nos deux tueurs ont bien vu qui tuer ?"}, {"c": "Lady Commandement", "x": "Allons s’ils ne connaissent pas la Reine, La Reine Macbeth !"}, {"c": "Macbeth", "x": "Qu’est-ce que tu racontes ? Je te parle de tuer, assassiner !"}, {"c": "Lady Commandement", "x": "Je suis tellement perturbée que je ne sais plus qui je suis- ah (regardant ses mains), et puis ces mains encore couvertes des stigmates sanguins de nos méfaits."}, {"t": "stage", "x": "Entrée de AG1 et AG 2."}, {"c": "Lady Commandement", "x": "Ah, que j’aimerais effacer pour toujours ces traces sur mes mains-(elle se frotte les mains)"}, {"t": "stage", "x": "AG1- AG2 saluent de manière révérencieuse."}, {"c": "AG1 + AG2", "x": "Votre Altesse. C’est fait, Sire, Banquo Kaput."}, {"c": "Macbeth", "x": "Kaput, Kaput ?"}, {"c": "AG1 + AG2", "x": "Ja, natürlich ! On lui fait une belle entaille dans les entrailles ! (ils miment)"}, {"c": "AG1", "x": "Et c’était pas qu’un test, hein ?"}, {"c": "AG2", "x": "Intestin ! Mon foi(e) (e), non ! (sourire de connivence)"}, {"t": "stage", "x": "Macbeth leur remet une bourse remplie de pièces."}, {"c": "AG1 + AG2", "x": "(regard mutuel de satisfaction -se mettent à chanter) Ein prosit, ein prosit ! La la la la, la la la la la la la la… Ein prosit, Ein.."}, {"c": "Macbeth", "x": "Ca suffit ! Et Malcom ?"}, {"c": "AG1", "x": "Malcom ?"}, {"c": "AG2", "x": "Comment ça, Malcom ?"}, {"c": "Macbeth", "x": "Savez-vous où il se trouve ?"}, {"c": "AG1", "x": "Nous, on s’est occupés de Banquo, comme vous nous l’aviez demandé, Sire."}, {"c": "AG2", "x": "Mais pas de Malcom"}, {"c": "AG1", "x": "Ah oui, on a suivi les ordres, point."}, {"c": "Macbeth", "x": "Bon, bon, vu. Vous pouvez disposer."}, {"c": "AG1 + AG2", "x": "De quoi ?"}, {"c": "Macbeth", "x": "Comment ça de quoi ?"}, {"t": "stage", "x": "Lady Co, restée dans la pièce, hausse les épaules en guise d’énervement et les toise en s’avançant vers eux."}, {"c": "Lady Commandement", "x": "Vous ne pouvez disposer de rien ; par contre taillez-vous ; c’est plus clair comme ça ?"}, {"c": "AG1 + AG2", "x": "Oui, votre Altesse, oui, oui, on dispose ; c’est sûr que là on a bien compris. (sortent)"}, {"c": "Lady Commandement", "x": "(plus câline) Dis-donc mon Mac, ma bête… Montre – toi plus rude, plus virile, plus raide, maintenant que tu es Roi !"}, {"c": "Macbeth", "x": "Ne le suis-je pas assez ? Duncan, maintenant Banquo, ça ne te suffit pas ? Ah !, La voie royale serait à présent dégagée pour moi, si ce satané Malcom ne s’était enfui…"}, {"c": "Lady Commandement", "x": "Stop aux tracas, mon Macounet ! Allez, accueillons nos invités, …"}, {"c": "Macbeth", "x": "Tu as raison, tenons notre rang et offrons notre meilleur visage."}, {"c": "Lady Commandement", "x": "Bien vu, mon Macounet ! Et si, pour mettre un peu de légèreté, on faisait une chaise musicale avant notre dîner ?"}, {"c": "Macbeth", "x": "Tu as de la suite dans les idées, nous, Ecossais, savons nous mettre/ tenir à carreaux avec un peu d’humour ! Allez Banco ! ( enjoué )"}, {"c": "Lady Commandement", "x": "Banco, mon Macbeth !"}, {"c": "Macbeth", "x": "Ah, Banco (attristé), Banco ; pourquoi reviens –tu hanter mon esprit même dans nos discussions les plus futiles ?"}, {"t": "stage", "x": "NOIR- Voix off – annonce du dîner « royal » de Macbeth (à voir pour formulation). Table avec chaises pour 6 personnes autour : Macbeth , Lady Co, Macduff, autres invités- lumière jour tamisée."}, {"c": "Macbeth", "x": "Chers amis, je vous remercie d’avoir répondu à mon invitation ; nous serions prêts à célébrer l’honneur de l’Ecosse entière si Banquo était arrivé, espérons qu’aucun contretemps fatal ne lui soit arrivé."}, {"c": "Macduff", "x": "Son absence signifierait-elle qu’il a rompu son engagement vis-à-vis de vous ?"}, {"c": "Macbeth", "x": "Qu’est-ce qui vous fait dire cela, Macduff ?"}, {"c": "Lady Commandement", "x": "(par diversion) Laissons de côté, ce petit incident et amusons-nous avec une chaise musicale."}, {"t": "stage", "x": "Lumière jour- On entend une musique (Le Connemara par ex) et les invités tournent jusqu’à un moment, la musique s’arrête. Un des 3* invités se retrouve sans chaise pour s’asseoir comme prévu. Il se retire, et prend une chaise. Lumière nuit –musique possible- arrive alors le fantôme de Banquo que seul Macbeth semble voir- le fantôme Banquo (ensanglanté) arrive avec une chaise et vient s’asseoir bout de table. Retour lumière jour- Macbeth est, seul, figé alors que les autres invités sont prêts à repartir pour un nouveau tour."}, {"c": "Lady Commandement", "x": "Chers amis, allons-y pour un nouveau tour ; celui qui restera pourrait décider du placement à table, n’est-ce pas, qu’en dis notre Roi ?"}, {"c": "Macbeth", "x": "Mais enfin, ne vois-tu rien ? Es-tu aveugle ?"}, {"c": "Invités", "x": "Sire, qu’est-ce qui vous prend ? Que voyez-vous d’anormal ? Continuons notre chaise musicale, en avant la musique !"}, {"c": "Lady Commandement", "x": "Oui, vous avez raison. C’est parti pour un tour ! (Elle fait un signe de lancement pour la musique, qui repart, mais Macbeth ordonne son arrêt aussitôt)"}, {"c": "Macbeth", "x": "Stop ! Arrêtez cette musique infernale !"}, {"c": "Lady Commandement", "x": "Allons Macbeth, nous sommes censés divertir nos invités, sans cela les diners deviennent ennuyeux !"}, {"c": "Macbeth", "x": "Mais enfin, ouvrez les yeux ! Comment pouvez-vous ? Qui a fait cette mauvaise blague ? (Montrant la chaise avec le fantôme de Banquo)"}, {"c": "Macduff", "x": "(allant saisir la chaise, le fantôme se meut pour assurer le retour de la chaise à sa place) Il suffit de la remettre à sa place, voilà tout."}, {"c": "Macbeth", "x": "Macduff, quelle est cette provocation ? (regardant ensuite le fantôme de Banquo) . Et toi, ne me regarde pas comme ça !"}, {"c": "Lady Commandement", "x": "(gênée) Mon mari est parfois sujet à des hallucinations dernièrement, sans doute un peu de fatigue, n’est-ce pas ? (Pas de réponse de Macbeth). Refaisons un dernier tour avant de passer à table. Musique, Maestro !"}, {"t": "stage", "x": "Lancement air de musique+ lumière colorée- biniou ?- puis arrêt musique- placement des invités- Macbeth se retrouve sans chaise, puisqu’il a peu bougé – lumière nuit – et le fantôme de Banquo vient se replacer à la table."}, {"c": "Macbeth", "x": "Qui a prévu de me narguer ainsi ?"}, {"c": "Invités", "x": "Que se passe-t-il Sire ? Mais enfin personne ne veut vous narguer !"}, {"c": "Macbeth", "x": "STOP ! Vous n’avez pas honte de m’insulter ainsi ! (regardant le fantôme) Hors de ma vue, tu n’as aucune moelle dans les os et ton sang est froid !"}, {"c": "Lady Commandement", "x": "(gênée) Bien, mes amis, le Roi semble quelque peu perturbé, sa charge monarchique l’a beaucoup fatiguée. Je vous invite à nous laisser pour l’instant. Avec toutes nos excuses."}, {"t": "stage", "x": "Les invités quittent la salle et le fantôme aussi. (Rupture ? A la Queue leu leu ?)"}, {"c": "Banco", "x": "(fantôme) Oui, ça vaut mieux, hein mon Macbeth !.. heu, non, Majesté ! (tire la langue, narguant)."}, {"c": "Macbeth", "x": "(essaie de poursuivre le fantôme qui disparaît) Put…, t’as fini d’me faire ch… !"}, {"c": "Macduff", "x": "Comment ? Qu’y a –t-il, Sire ?"}, {"c": "Lady Commandement", "x": "Il a dit qu’il était très touché !"}, {"c": "Macduff", "x": "Bien , veillez sur notre Roi, et on se revoit dès demain !"}, {"c": "Lady Commandement", "x": "Oui, merci brave Macduff, dès demain… Dès deux mains (regardant ses 2 mains – (douche rouge, elle s’écrie, tout en se frottant les mains incessamment) – Ah ! Otez –moi ces marques sanguinolentes de crime. (sort). Vont-elles disparaître de ma vue un jour !"}, {"c": "Macbeth", "x": "(seul sur scène) Quant à moi, j’irai demain dès l’aube, visiter les sœurs du destin, Ririte, Fifite et Liloute pour en savoir davantage sur le mien."}, {"t": "stage", "x": "NOIR"}]},
{"id": "a4s1", "label": "Acte 4 — Scène 1", "title": "Macbeth rend à nouveau visite aux sorcières", "lines": [{"t": "stage", "x": "Une forêt , les 3 sorcières touillent autour d’un chaudron et chantent."}, {"c": "Ririte + Fifite", "x": "(Air : « J’ai la rate…Ah mon Dieu qu’c’est embêtant … »)\n« De la bave de crapaud,\nBien épaisse comm’il faut\nDu venin de serpent\nPour qu’ça piqu’également\nDes entrailles de cochon,\nEt ça s’ra vraiment bon !\nAh, qu’ c’est compliqué de cuisiner en tant qu’sorcière !\nMême, nous dans nos r’cettes, parfois il arriv’ qu’on s’y perd ! »"}, {"t": "stage", "x": "Arrive Liloute sur son balai ( bruit de véhicule ?)"}, {"c": "Liloute", "x": "Salut les girls ! (signe de salut individuel bises/ check- jetée sort…), ça touille ?"}, {"c": "Ririte + Fifite", "x": "Oui, mais qu’est-ce que c’est chiant de cuisiner ces ingrédients !"}, {"c": "Ririte + Fifite", "x": "(Reprise refrain) Ah, qu’ c’est compliqué de cuisiner quand faut qu’tu touilles !\nAu bout d’un moment, tu sais , ça te casse les cou….. !"}, {"c": "Liloute", "x": "Stop, les cocottes ! Si cuisiner est votre point noir,…"}, {"c": "Ririte + Fifite", "x": "Notre point noir ? ( elles montrent leur verrue/pustule noir au visage)."}, {"c": "Liloute", "x": "Mais non ! Si ça vous embête, j’ai la solution ; grâce à ce cube !... (elle sort un cube)"}, {"c": "Ririte + Fifite", "x": "Ce cube ?"}, {"c": "Liloute", "x": "Ces cubes … (Elle en jette un dans le chaudron) Et voilà le travail ! Avec ce cube on s’en sort ! Jette un cube, jette un sort !"}, {"c": "Ririte + Fifite", "x": "Maggi, Maggi ! et ton idée c’est du génie ! (chanté sur air de pub !)"}, {"c": "Liloute", "x": "Avec du Pop- Rock, c’est encore mieux, c’est le plus Popu, Plus Rocku !"}, {"t": "stage", "x": "Air Maggi- Rock-Musique- chant- « Du velouté pour ma Louloute (rock) petite chorégraphie de Riri Fifi avec chaudron/ autour et en touillant)."}, {"c": "Ririte + Fifite", "x": "Pas mal ! Et si on rajoutait un peu d’exotisme ?"}, {"c": "Liloute", "x": "(jette un autre cube) Cube des îles ! Jette un cube ! Jette un sort !"}, {"c": "Ririte + Fifite", "x": "Alors , c’est carrément plus Zouk ! C’est zouku !"}, {"t": "stage", "x": "Air Pubkadi- danse autour de chaudron- type danse du ventre."}, {"c": "Liloute", "x": "Normal, c’est magie « noire » ! Ajoutons du fiel de bouc, des entrailles de loup, des yeux de lézard !"}, {"c": "Ririte + Fifite", "x": "Alors là, ça va être goûtu !"}, {"c": "Liloute", "x": "Et encore des pattes de coq !"}, {"c": "Ririte + Fifite", "x": "Carrément, pattes de coq, c’est cocu !"}, {"c": "Liloute", "x": "Et enfin, du taureau avec des cornes !"}, {"c": "Ririte", "x": "Alors, là c’est Bastien ?"}, {"c": "Fifite + Liloute", "x": "(regard interrogatif) C’est Bastien ?"}, {"c": "Ririte", "x": "Des cornes, … Le cornu, c’est Bastien !"}, {"c": "Ririte + Fifite", "x": "Et maintenant touche finale pour peaufiner notre bouillie !"}, {"c": "Liloute", "x": "Bouwie ? vous avez dit « bowie » ?!"}, {"t": "stage", "x": "Musique « Let’s dance », David Bowie, les sorcières se mettent à danser en remuant le popotin. Reprise de danse autour du chaudron : chorégraphie en remuant le popotin- arrivée par l’arrière de Macbeth qui s’essuie les yeux devant le spectacle qui s’offre à lui-."}, {"c": "Ririte + Fifite", "x": "Je crois qu’il faut que l’on s’arrête (chanté sur Bambino ou pas )."}, {"c": "Liloute", "x": "Car il me semble entendre Macbeth."}, {"c": "Macbeth", "x": "(Bambino- refrain) Oui, en effet !\nC’est moi qu’arrive et j’ai vue\nOui, j’ai vue, oui j’ai vue"}, {"c": "Ririte + Fifite + Liloute", "x": "(Reprise) Tu as vue, tu as vue\nTu as vue sur nos trois (elles se tapent le postérieur*)\nNos trois….(*), nos trois …(*)"}, {"t": "stage", "x": "Fin- chant coupé par Macbeth."}, {"c": "Macbeth", "x": "Halte-là, sorcières du mystère, des ténèbres et de minuit, que faîtes-vous là ? (montrant le chaudron)"}, {"c": "Ririte", "x": "Une de nos mixtures préférées !"}, {"c": "Fifite", "x": "Préparées avec « amour »…"}, {"c": "Liloute", "x": "Et avec Maggi !"}, {"c": "Ririte + Fifite + Liloute", "x": "Maggi, magie, et nos idées ont du génie !"}, {"c": "Macbeth", "x": "De grâce, Sœurs du Destin (il les implore – à genoux ?), répondez à mes questions"}, {"c": "Ririte", "x": "Vas-y mon p’tit Macbeth"}, {"c": "Fifite", "x": "Parle"}, {"c": "Liloute", "x": "Nous répondrons (Coup de tonnerre) !"}, {"t": "stage", "x": "Elles prennent une louchée de la potion et la porte aux lèvres de Macbeth, une autre sorcière lui met une serviette, comme à un bébé. Macbeth réagit par un une grimace de dégoût."}, {"c": "Macbeth", "x": "Ah ! Mais c’est dégueu…"}, {"c": "Ririte", "x": "Chut, chut…., Calme-toi Macbeth, cette potion nous permettra de mieux voir tes demandes."}, {"c": "Macbeth", "x": "Ah, mais c’est dégueu…"}, {"c": "Fifite", "x": "Ca suffit, mon p’tit Macbeth, on finit sa sou-soupe, si tu veux tes réponses."}, {"c": "Macbeth", "x": "D’accord, mais cette potion est dégueu…"}, {"c": "Liloute", "x": "Lasse… on sait ! Et nous tu nous lasses justement, alors laisse- nous voir l’effet."}, {"c": "Macbeth", "x": "Mais je vois pas les fées, je ne vois que vous, sorcières !"}, {"c": "Ririte", "x": "on parle de l’effet de la potion !"}, {"t": "stage", "x": "Elle le frappe sur la tête- Macbeth réagit par un aïe !"}, {"c": "Fifite", "x": "L’effet de la potion ! (Re-aïe !)"}, {"c": "Liloute", "x": "L’effet potion, c’est compris, triple idiot ! (Re-aïe !)"}, {"c": "Macbeth", "x": "Oui, oui, évidemment- mais dîtes-moi, ce qui me garantira la longévité de mon pouvoir !"}, {"t": "stage", "x": "Coup de tonnerre- une lumière éclaire les visages des sorcières – ou douche sur Macbeth entouré des sorcières."}, {"c": "Voix céleste", "x": "Macbeth ! Macbeth ! Méfie-toi de Macduff !"}, {"c": "Macbeth", "x": "Macduff ? Comment est-ce possible ?..."}, {"c": "Voix céleste", "x": "Macbeth ! Macbeth ! Sois sanguinaire et décidé ; nul homme né naturellement d’une femme ne peut nuire à Macbeth !"}, {"c": "Macbeth", "x": "(partant d’un grand éclat de rire), né naturellement d’une femme ! Me voilà tranquille !..."}, {"c": "Voix céleste", "x": "Macbeth ! Macbeth ! Sois fier comme un lion ; jamais Macbeth ne sera vaincu jusqu’à ce que la forêt de Birnam marche contre lui !"}, {"c": "Macbeth", "x": "(redoublant d’un rire « carnassier !) Je sens mon instinct carnassier, la bête se réveille en moi, Macbeth- (Metro Goldwynn Meyer ? ) Une forêt qui marche ! Cela n’arrivera jamais ! Qui peut commander à l’arbre de détacher sa racine liée à la terre !"}, {"c": "Ririte + Fifite + Liloute", "x": "Que dirais-tu d’une autre cuillerée de notre bouillie ?"}, {"c": "Macbeth", "x": "(implorant) Non, de grâce, mes bonnes sorcières, dîtes-moi plutôt si la descendance de Banquo règnera un jour sur ce pays ?"}, {"c": "Ririte + Fifite + Liloute", "x": "Allons Macbeth, ne cherche pas à en savoir davantage !"}, {"t": "stage", "x": "NOIR / Les sorcières disparaissent-Apparition Banquo ?- passage scène…"}]},
{"id": "a4s2", "label": "Acte 4 — Scène 2", "title": "Lady Macbeth et son obsession", "lines": [{"t": "stage", "x": "Scène possible en plus – séance de Lady Co , chez le/la psy ? A voir. Scène dans la pénombre chez les Macbeth- salle sobre- une table bureau- un globe terrestre en plastique- un maillet/parapluie ? ; Lady Macbeth entre et se promène sur scène – somnambule- elle se frotte les mains constamment et peut aller se les laver."}, {"c": "Lady Commandement", "x": "Ah ! cette maudite tache ne partira donc jamais ! Qui aurait cru que le vieux Roi Duncan avait tant de sang dans le corps ! …"}, {"t": "stage", "x": "Apparaissent en bord de scène – Macbeth et un médecin."}, {"c": "Macbeth", "x": "Elle se lave les mains sans relâche"}, {"c": "Médecin", "x": "Je connais des personnes qui se promenaient dans leur sommeil – Lady Macbeth semble bien troublée tout de même… Cette maladie est au-dessus de mon art…"}, {"c": "Lady Commandement", "x": "(puis sentant l’air ambiant, et reniflant sans cesse) Il y a une odeur de sang… Comment faire disparaître et purifier tout ceci ! … Ah !.. (se dirigeant vers public)"}, {"c": "Macbeth", "x": "Pourvu qu’elle ne tombe pas !"}, {"c": "Médecin", "x": "Elle est déjà tombée… dans un sommeil second !"}, {"c": "Macbeth", "x": "Regardez, comme elle se dirige directement vers cet homme !"}, {"c": "Lady Commandement", "x": "Ah ! ça sent le mâle ! Au lit ! Au lit ! Venez, donnez-moi votre main ! … Ah, ça sent le mâle !"}, {"c": "Médecin", "x": "Il faut croire que c’était un mâle attendu !"}, {"c": "Macbeth", "x": "Ou un mâle adroit !..."}, {"c": "Lady Commandement", "x": "(entraînant l’homme du public et revenant sur scène) Lavez vos mains , mettez votre robe de nuit, ne savez-vous pas que Banquo a été enterré ; il ne peut pas sortir de son tombeau !"}, {"c": "Macbeth", "x": "Qu’est-ce qu’elle raconte ? Va-t-elle retourner à son lit ?"}, {"c": "Médecin", "x": "Tout droit."}, {"c": "Lady Commandement", "x": "(arrivée à hauteur de Macbeth, elle s’arrête et hume l’air. Elle lâche la main de l’homme du public) Ah ! Mais ça sent le mâle ici, ça sent la bête … Comme un Mac animal, un Mac bête… (reprise Metro Goldwynn Meyer- Lion) … mais et ça sent aussi le mal, oui surtout le mal ! (Elle sort, Macbeth)."}, {"t": "stage", "x": "Macbeth est prêt à réagir mais le Médecin l’en empêche."}, {"c": "Médecin", "x": "Il a été murmuré de terribles secrets ! Des actions contre nature peuvent produire des désordres contre nature !"}, {"c": "Macbeth", "x": "Que faire, Docteur ?"}, {"c": "Médecin", "x": "Ayez toujours l’œil sur elle et écartez d’elle tout ce qui pourrait la déranger. Mais pour l’instant, détendez-vous pour retrouver votre tranquillité. (Le médecin sort, Macbeth est seul sur scène)"}]},
{"id": "a4s3", "label": "Acte 4 — Scène 3", "title": "Macbeth et ses fantasmes", "lines": [{"t": "stage", "x": "Sur une musique douce, Macbeth se dirige vers le bureau, il se saisit du globe (si possible plastique (illuminé ?) puis le fait virevolter- jouera avec- ensuite il prendra le parapluie et frappera ce globe comme s’il jouait au golf – sous les yeux de Macduff et Malcom qui arriveront via le public."}]},
{"id": "a5s1", "label": "Acte 5 — Scène 1", "title": "L’attaque se prépare", "lines": [{"c": "Macduff", "x": "Approchons-nous du château d’Ilsemeur et de son tyran, cette ordure de Macbeth !"}, {"c": "Malcolm", "x": "Gardez votre sang froid, Macduff, nous devons être prudents pour le vaincre !"}, {"c": "Macduff", "x": "Prudents mais intraitables ! Je vous rappelle qu’il a décimé femmes et enfants – ma propre famille est passée au fil de son épée !"}, {"c": "Malcolm", "x": "Nous voici à présent dans la forêt de Dunsinane, soyons plus rusés que cruels. Je propose de tailler quelques branchages et d’avancer ainsi masqués pour nous camoufler !"}, {"c": "Macduff", "x": "Et pour éviter le camouflet ! Bonne idée Malcom- voyons voir (se mêlant au public)… il y a pas mal de vieilles souches par ici."}, {"c": "Malcolm", "x": "(allant sur une autre zone du public) Approche donc par ici, y’a plus de futaies !"}, {"c": "Macduff", "x": "J’espère que c’est des futaies assez futées,… parce que si c’est pas fut’fut ‘ , tu oublies !"}, {"c": "Malcolm", "x": "(touchant quelques spectateurs/trices) Oh, mais c’est qu’il y a de la verdeur , attention ! le fluide est tonique, vigoureux !"}, {"c": "Macduff", "x": "(arrivant pour vérifier) tonique, tonique, … Ces deux -là sont de vieilles branches…"}, {"c": "Malcolm", "x": "Evidemment, ils s’connaissent trop ! C’est un peu l’arbre qui cache la forêt !"}, {"c": "Macduff", "x": "Ne traînons plus ! Regarde, j’aperçois à nouveau ce tyran de Macbeth ! (Macbeth dans la pénombre- apparaît toujours avec un (canne bois)club de golf en bois et une boule en forme de mappemonde)"}, {"c": "Malcolm", "x": "Allons-y (se saisissant d’une poignée de branchages et en en passant aux différents spectateurs d’un rang ou de quelques rangs)."}, {"c": "Macduff", "x": "(imitant Malcom et invitant les spectateurs à chanter de même sur l’air de « Débranche » de France Gall)\n« Des branches, des branches, tous !\nDes branches, des branches, des branches, tous\nPour qu’on avance tous ! » (à doubler/tripler selon adaptation)"}, {"t": "stage", "x": "Pendant cette scène 1 serviteur peut être spectateur de la mise en place puis court vers la scène lorsqu’elle se rallume – On y retrouve Macbeth, armé d’une épée qu’il utilisera pour « jouer au golf »."}]},
{"id": "a5s2", "label": "Acte 5 — Scène 2", "title": "Lady Co dans le champ de tir", "lines": [{"t": "stage", "x": "Macbeth utilise son épée et tire quelques balles en direction des coulisses."}, {"c": "Macbeth", "x": "Méfie-toi de Macduff !"}, {"t": "stage", "x": "Puis il tire assez fort – on entend un « aïe » en coulisses."}, {"c": "Macbeth", "x": "d’un homme né naturellement d’une femme !"}, {"t": "stage", "x": "Il tire à nouveau plus fort, nouveau « aïe » en coulisses."}, {"c": "Macbeth", "x": "quand la forêt de Birnam marchera contre moi !"}, {"t": "stage", "x": "Il frappe violemment, puis se met à rire. On entend alors un cri d’étouffement dans les coulisses- il s’agit de Lady Co, qu’on verra avancer, titubant, avec 2 yeux « au beurre noir et avec une balle dans la bouche, avant de s’affaler en rendant son dernier souffle."}, {"c": "Macbeth", "x": "Oh, ma Lady Co ! Lady Macbeth ! Pourquoi a-t-il fallu que tu sois dans mon champ de tir ? ( Il se relève, la regarde) Tu vois, tu avais sans doute les yeux plus gros que le ventre !"}, {"t": "stage", "x": "Arrive alors le serviteur tout tremblant."}]},
