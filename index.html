function saveVoiceParams(){localStorage.setItem('macbethVoiceParams',JSON.stringify(voiceParams))}
function voices(){return speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('fr'))}
function renderVoices(){const vs=voices(),box=$('voices');box.innerHTML='';chars.forEach(c=>{const p=paramsFor(c);let row=document.createElement('div');row.className='voiceRow';let opts=vs.map((v,n)=>`<option value="${n}" ${voiceMap[c]===v.name?'selected':''}>${v.name}</option>`).join('');row.innerHTML=`<b>${c}</b><select aria-label="Voix de ${c}">${opts}</select><label class="voiceControl"><span>Vitesse</span><input class="rateSlider" type="range" min="0.65" max="1.35" step="0.05" value="${p.rate}"><span class="voiceValue rateValue">${p.rate.toFixed(2)}×</span></label><label class="voiceControl"><span>Pitch</span><input class="pitchSlider" type="range" min="0.60" max="1.40" step="0.05" value="${p.pitch}"><span class="voiceValue pitchValue">${p.pitch.toFixed(2)}</span></label><button class="voiceTest">Tester</button>`;let sel=row.querySelector('select');sel.onchange=()=>{voiceMap[c]=vs[+sel.value]?.name;localStorage.setItem('macbethVoices',JSON.stringify(voiceMap))};const rate=row.querySelector('.rateSlider'),pitch=row.querySelector('.pitchSlider'),rateV=row.querySelector('.rateValue'),pitchV=row.querySelector('.pitchValue');rate.oninput=()=>{voiceParams[c]={...paramsFor(c),rate:+rate.value};rateV.textContent=(+rate.value).toFixed(2)+'×';saveVoiceParams()};pitch.oninput=()=>{voiceParams[c]={...paramsFor(c),pitch:+pitch.value};pitchV.textContent=(+pitch.value).toFixed(2);saveVoiceParams()};row.querySelector('.voiceTest').onclick=()=>speakText(c,'Je joue '+c);box.appendChild(row)})}
speechSynthesis.onvoiceschanged=renderVoices;
function baseChar(c){if(!c)return '';let best='',bestPos=Infinity;for(const [canon,names] of Object.entries(aliases)){for(const n of names){const pos=c.toLocaleLowerCase('fr').indexOf(n.toLocaleLowerCase('fr'));if(pos>=0&&pos<bestPos){best=canon;bestPos=pos}}}return best||c.split(/\s*\+\s*|\s+et\s+|,|\//i)[0].trim()}
function clearAutoTimers(){if(stageTimer){clearTimeout(stageTimer);stageTimer=null}if(speechStartTimer){clearTimeout(speechStartTimer);speechStartTimer=null}}

// Audio pré-généré pour l’ensemble de la pièce.
// Les MP3 sont chargés automatiquement depuis audio/<scene>/<scene>_XXX.mp3.
let recordedAudio=null;
function recordedSrcFor(c,x){
 if(!currentScene||!L[i]||L[i].t==='stage'||L[i].c!==c||L[i].x!==x)return null;
 let spoken=0;for(let n=0;n<=i;n++)if(L[n]&&L[n].c)spoken++;
 return `audio/${currentScene}/${currentScene}_${String(spoken).padStart(3,'0')}.mp3`;
}
function stopRecordedAudio(){
 if(recordedAudio){recordedAudio.onended=null;recordedAudio.onerror=null;try{recordedAudio.pause()}catch(e){};recordedAudio=null}
}
function stopPlayback(){clearAutoTimers();stopRecordedAudio();speechSynthesis.cancel();speaking=false}
function speakText(c,x,onend){
 speechSynthesis.cancel();stopRecordedAudio();
 const recordedSrc=recordedSrcFor(c,x);
 if(recordedSrc){
   const a=new Audio(recordedSrc);recordedAudio=a;a.volume=masterVolume;a.playbackRate=globalSpeed;
   try{a.preservesPitch=true;a.webkitPreservesPitch=true}catch(e){}
   a.onended=()=>{if(recordedAudio===a)recordedAudio=null;speaking=false;if(!paused)onend&&onend()};
   a.onerror=()=>{if(recordedAudio===a)recordedAudio=null;speaking=false;console.warn('Audio pré-généré indisponible, repli sur la voix système :',recordedSrc);speakSystemVoice(c,x,onend)};
   speaking=true;const playPromise=a.play();if(playPromise&&playPromise.catch)playPromise.catch(()=>{a.onerror&&a.onerror()});return;
 }
 speakSystemVoice(c,x,onend);
}
function speakSystemVoice(c,x,onend){
 let u=new SpeechSynthesisUtterance(x),vs=voices(),bc=baseChar(c),chosen=vs.find(v=>v.name===voiceMap[bc]);u.volume=masterVolume;if(!chosen&&vs.length)chosen=vs[Math.abs(chars.indexOf(bc))%vs.length];if(chosen)u.voice=chosen;u.lang='fr-FR';const p=paramsFor(bc);u.rate=Math.max(.5,Math.min(4,p.rate*globalSpeed));u.pitch=Math.max(.5,Math.min(2,p.pitch));u.onend=()=>{speaking=false;if(!paused)onend&&onend()};u.onerror=()=>{speaking=false};speaking=true;speechSynthesis.speak(u)
}
function contextHTML(e,label){
 if(!e)return '<div class="ctxLabel">'+label+'</div>';
 const isStage=e.t==='stage'; const who=isStage?'DIDASCALIE':e.c;
 return `<div class="ctxLabel">${label}</div><div class="ctxSpeaker">${who||''}</div><div class="ctxText">${e.x||''}</div>`;
}
function renderContext(){
 const prev=$('prevContext'),next=$('nextContext'),pe=L[i-1],ne=L[i+1];
 prev.className='contextLine'+(!pe?' empty':'')+(pe&&mine(pe)?' mineContext':'')+(pe&&pe.t==='stage'?' stageContext':'');
 next.className='contextLine'+(!ne?' empty':'')+(ne&&mine(ne)?' mineContext':'')+(ne&&ne.t==='stage'?' stageContext':'');
 prev.innerHTML=contextHTML(pe,'Réplique précédente'); next.innerHTML=contextHTML(ne,'Réplique suivante');
}
let mobileSceneTap=false;
function scheduleCurrent(){
 if(!started||paused)return;
 const e=L[i],isMine=mine(e);
 if(isMine){$('mainBtn').textContent='J’ai fini → Continuer';return}
 if(e.t==='stage'){
   $('mainBtn').textContent='⏸ Pause'; status.textContent+=status.textContent.includes('Didascalie')?'':' · Didascalie';
   const words=(e.x||'').trim().split(/\s+/).filter(Boolean).length;
   const delay=Math.max(1600,Math.min(4000,900+words*85));
   stageTimer=setTimeout(()=>{stageTimer=null;if(!paused)advance(true)},delay);
 } else {
   $('mainBtn').textContent='⏸ Pause';
   if(muted){
     const words=(e.x||'').trim().split(/\s+/).filter(Boolean).length;
     const delay=Math.max(900,Math.min(8000,(700+words*250)/globalSpeed));
     speechStartTimer=setTimeout(()=>{speechStartTimer=null;if(!paused)advance(true)},delay);
   }else{
     if(mobileSceneTap){speakText(e.c,e.x,()=>advance(true))}else{speechStartTimer=setTimeout(()=>{speechStartTimer=null;if(!paused)speakText(e.c,e.x,()=>advance(true))},180);}
   }
 }
}

function textWeight(e){return Math.max(1,(e?.x||'').length)}
function ratioForIndex(idx){
 const weights=L.map(textWeight),total=weights.reduce((a,b)=>a+b,0);
 const before=weights.slice(0,idx).reduce((a,b)=>a+b,0);
 return total?(before+weights[idx]*.5)/total:0;
}
function indexForRatio(r){
 const weights=L.map(textWeight),total=weights.reduce((a,b)=>a+b,0),target=Math.max(0,Math.min(1,r))*total;
 let sum=0;
 for(let n=0;n<weights.length;n++){if(sum+weights[n]>=target)return n;sum+=weights[n]}
 return Math.max(0,weights.length-1);
}
function updateTextProgress(){
 const r=ratioForIndex(i),p=Math.round(r*100);
 const fill=$('v2ProgressFill'),thumb=$('v2ProgressThumb'),bar2=$('v2Progress');
 if(fill)fill.style.width=p+'%';if(thumb)thumb.style.left=p+'%';
 if($('v2ProgressPct'))$('v2ProgressPct').textContent=p+' %';
 const seek=$('seekSlider');if(seek&&!seek.matches(':active'))seek.value=String(p);
}
function jumpTextRatio(r){
 stopPlayback();started=true;paused=false;i=indexForRatio(r);render();
}
function animatePrompt(){
 const c=$('card');c.classList.remove('promptPulse');void c.offsetWidth;c.classList.add('promptPulse');
 setTimeout(()=>c.classList.remove('promptPulse'),320);
}

function render(){
 stopPlayback(); let e=L[i],isMine=mine(e); const sc=scenes.find(s=>s.id===currentScene); $('sceneTitle').textContent=sc.label+' — '+sc.title;
 line.textContent=''; line.className='line'+(isMine?' hiddenline':''); revealed=false;
 card.classList.toggle('you',isMine);card.classList.toggle('stage',e.t==='stage');
 speaker.textContent=e.t==='stage'?'DIDASCALIE':(isMine?'🎭 '+e.c+' — À TOI':e.c);
 dir.textContent=e.d?'('+e.d+')':''; line.textContent=e.x;
 $('revealBtn').textContent='👁 Afficher ma réplique'; $('revealBtn').disabled=!isMine;
 renderContext(); updateTextProgress(); animatePrompt(); status.textContent=`${i+1} / ${L.length}`;
 if(!started){$('mainBtn').textContent='▶ Commencer';return}
 if(paused){$('mainBtn').textContent='▶ Reprendre';status.textContent+=' · En pause';return}
 if(isMine){$('mainBtn').textContent='J’ai fini → Continuer';status.textContent+=' · À toi ('+learningRoles.join(' + ')+')';}
 scheduleCurrent();
}
function pausePlayback(){
 if(paused||!started||mine(L[i]))return;
 paused=true; clearAutoTimers();
 if(speaking){if(recordedAudio)recordedAudio.pause();else speechSynthesis.pause()}
 $('mainBtn').textContent='▶ Reprendre'; status.textContent=status.textContent.replace(' · En pause','')+' · En pause';
}
function resumePlayback(){
 if(!paused)return;
 paused=false;
 if(speaking && recordedAudio){recordedAudio.playbackRate=globalSpeed;recordedAudio.play();$('mainBtn').textContent='⏸ Pause';status.textContent=status.textContent.replace(' · En pause','');}
 else if(speaking && speechSynthesis.paused){speechSynthesis.resume();$('mainBtn').textContent='⏸ Pause';status.textContent=status.textContent.replace(' · En pause','');}
 else {status.textContent=status.textContent.replace(' · En pause','');scheduleCurrent()}
}
function setActiveSceneButton(){document.querySelectorAll('#sceneNav button').forEach(b=>b.classList.toggle('active',b.dataset.id===currentScene));}
function goToNextScene(){
 const sceneIndex=scenes.findIndex(s=>s.id===currentScene);
 if(sceneIndex>=0 && sceneIndex<scenes.length-1){currentScene=scenes[sceneIndex+1].id;localStorage.setItem('macbethScene',currentScene);L=scenes[sceneIndex+1].lines;i=0;paused=false;setActiveSceneButton();render();return true}
 return false;
}
function advance(auto=false){paused=false;if(i<L.length-1){i++;render()}else if(!goToNextScene()){stopPlayback();status.textContent='Fin de l’extrait ✓';$('mainBtn').textContent='↺ Recommencer'}}
$('mainBtn').onclick=()=>{
 if(!started){started=true;paused=false;render();return}
 if(paused){resumePlayback();return}
 const e=L[i];
 if(!mine(e) && (speaking||speechStartTimer||stageTimer)){pausePlayback();return}
 if(mine(e)){advance();return}
 if(i===L.length-1){if(!goToNextScene()){i=0;render()}return}
 advance();
};
$('prevBtn').onclick=()=>{started=true;paused=false;i=Math.max(0,i-1);render()};
$('nextBtn').onclick=()=>{started=true;paused=false;if(i<L.length-1){i++;render()}else goToNextScene()};
$('replayBtn').onclick=()=>{paused=false;let e=L[i];if(e.c&&!mine(e)){stopPlayback();if(!muted)speakText(e.c,e.x,()=>{});else render()}else render()};
$('muteBtn').onclick=()=>{muted=!muted;localStorage.setItem('macbethMuted',muted?'1':'0');stopPlayback();paused=false;updateTopControls();if(started&&!mine(L[i]))scheduleCurrent()};
$('speedBtn').onclick=()=>{const n=(speedSteps.indexOf(globalSpeed)+1)%speedSteps.length;globalSpeed=speedSteps[n];localStorage.setItem('macbethGlobalSpeed',globalSpeed);stopPlayback();paused=false;updateTopControls();if(started&&!mine(L[i]))scheduleCurrent()};
let voiceMode=false;
$('settingsBtn').onclick=()=>{
 const p=$('settingsPanel'),btn=$('settingsBtn');
 voiceMode=!voiceMode;
 btn.classList.toggle('controlActive',voiceMode);
 btn.setAttribute('aria-pressed',voiceMode?'true':'false');
 if(voiceMode){
   p.classList.add('open');renderVoices();
   requestAnimationFrame(()=>{p.scrollIntoView({behavior:'smooth',block:'start'});p.classList.remove('voiceFlash');void p.offsetWidth;p.classList.add('voiceFlash');setTimeout(()=>p.classList.remove('voiceFlash'),1200)});
 }else{
   $('card').scrollIntoView({behavior:'smooth',block:'start'});
 }
};
$('revealBtn').onclick=()=>{if(!mine(L[i]))return;revealed=!revealed;line.classList.toggle('revealedline',revealed);$('revealBtn').textContent=revealed?'🙈 Masquer ma réplique':'👁 Afficher ma réplique'};
function setupUI(){
 const roles=[...sortedRoles],menu=$('roleMenu'),picker=$('rolePicker'),pickerBtn=$('rolePickerBtn');
 function updateRoleLabel(){$('rolePickerLabel').textContent=learningRoles.length===0?'Sélectionner le(s) personnage(s) joué(s)':(learningRoles.length<=2?learningRoles.join(' + '):learningRoles.length+' rôles sélectionnés')}
 menu.innerHTML=roles.map(r=>`<label class="roleChoice"><input type="checkbox" value="${r}" ${learningRoles.includes(r)?'checked':''}><span>${r}</span></label>`).join('');
 pickerBtn.onclick=()=>picker.classList.toggle('open');
 menu.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{picker.classList.remove('open');let chosen=[...menu.querySelectorAll('input:checked')].map(x=>x.value);learningRoles=chosen;localStorage.setItem('macbethRoles',JSON.stringify(learningRoles));updateRoleLabel();started=false;paused=false;i=0;updateChars();renderVoices();render()});
 updateRoleLabel();
 const nav=$('sceneNav');
 const prologue=scenes.find(s=>s.id==='prologue');
 const groups={}; scenes.filter(s=>s.id!=='prologue').forEach(s=>{const m=s.id.match(/^a(\d+)/);const a=m?Number(m[1]):0;(groups[a]||(groups[a]=[])).push(s)});
 const currentAct=(()=>{const m=currentScene.match(/^a(\d+)/);return m?Number(m[1]):0})();
 nav.innerHTML=`<button data-id="prologue" class="prologueNav ${currentScene==='prologue'?'active':''}">Prologue<small style="display:block;opacity:.65;font-weight:500;margin-top:2px">${prologue?.title||''}</small></button>`+Object.keys(groups).map(a=>`<div class="actGroup ${Number(a)===currentAct?'open':''}" data-act="${a}"><button type="button" class="actToggle"><span>Acte ${a}</span><span class="chev">›</span></button><div class="actScenes">${groups[a].map(s=>`<button data-id="${s.id}" class="${s.id===currentScene?'active':''}">${s.label.replace(/^Acte\s*[^·—-]+[·—-]\s*/i,'')}<small style="display:block;opacity:.65;font-weight:500;margin-top:2px">${s.title}</small></button>`).join('')}</div></div>`).join('');
 nav.querySelectorAll('.actToggle').forEach(b=>b.onclick=()=>b.closest('.actGroup').classList.toggle('open'));
 nav.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{stopPlayback();currentScene=b.dataset.id;localStorage.setItem('macbethScene',currentScene);L=scenes.find(s=>s.id===currentScene).lines;i=0;started=true;paused=false;setActiveSceneButton();const m=currentScene.match(/^a(\d+)/);if(m){const g=nav.querySelector(`.actGroup[data-act="${m[1]}"]`);if(g)g.classList.add('open')}mobileSceneTap=window.matchMedia('(max-width:850px)').matches;render();mobileSceneTap=false; if(window.matchMedia('(max-width:850px)').matches && L[i]?.t==='stage' && !muted){try{const u=new SpeechSynthesisUtterance(' ');u.lang='fr-FR';u.volume=0;speechSynthesis.speak(u)}catch(e){}}});
 
 const pbar=$('v2Progress'),seek=$('seekSlider');
 if(pbar&&seek){
   const preview=()=>{
     const p=Number(seek.value);
     $('v2ProgressFill').style.width=p+'%';$('v2ProgressThumb').style.left=p+'%';
     $('v2ProgressPct').textContent=p+' %';pbar.classList.add('dragging');
   };
   seek.addEventListener('input',preview);
   const commit=()=>{pbar.classList.remove('dragging');jumpTextRatio(Number(seek.value)/100)};
   seek.addEventListener('change',commit);
   seek.addEventListener('pointerup',()=>{ if(document.activeElement===seek) commit(); });
 }



 const vol=$('volumeSlider'),volVal=$('volumeValue');
 if(vol){
   vol.value='100'; masterVolume=1;
   vol.oninput=()=>{
     masterVolume=Number(vol.value)/100;
     volVal.textContent=vol.value+'%';
   };
 }

 updateChars();renderVoices();updateTopControls();
}
document.addEventListener('keydown',e=>{if(['SELECT','INPUT'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();$('mainBtn').click()}else if(e.key==='ArrowLeft')$('prevBtn').click();else if(e.key==='ArrowRight')$('nextBtn').click();else if(e.key.toLowerCase()==='r')$('replayBtn').click()});setupUI();render();


</script><script>
(function(){
 const nav=document.getElementById('sceneNav'), track=document.getElementById('navScrollbar'), thumb=document.getElementById('navScrollbarThumb');
 if(!nav||!track||!thumb) return;
 function update(){
   const vh=nav.clientHeight, sh=nav.scrollHeight, th=track.clientHeight;
   if(!vh||!th) return;
   if(sh<=vh+1){track.style.opacity='.35'; thumb.style.height='100%'; thumb.style.transform='translateY(0)'; return;}
   track.style.opacity='1';
   const h=Math.max(38, th*vh/sh), maxT=th-h, maxS=sh-vh;
   thumb.style.height=h+'px'; thumb.style.transform='translateY('+((nav.scrollTop/maxS)*maxT)+'px)';
 }
 nav.addEventListener('scroll',update,{passive:true});
 new ResizeObserver(update).observe(nav);
 new MutationObserver(()=>requestAnimationFrame(update)).observe(nav,{childList:true,subtree:true,attributes:true});
 let sy=0, ss=0;
 thumb.addEventListener('pointerdown',e=>{e.preventDefault();sy=e.clientY;ss=nav.scrollTop;thumb.setPointerCapture(e.pointerId);thumb.classList.add('dragging')});
 thumb.addEventListener('pointermove',e=>{if(!thumb.hasPointerCapture(e.pointerId))return; const th=track.clientHeight,h=thumb.offsetHeight,maxT=th-h,maxS=nav.scrollHeight-nav.clientHeight;if(maxT>0)nav.scrollTop=ss+(e.clientY-sy)*maxS/maxT;});
 thumb.addEventListener('pointerup',e=>{try{thumb.releasePointerCapture(e.pointerId)}catch(_){ } thumb.classList.remove('dragging')});
 track.addEventListener('pointerdown',e=>{if(e.target===thumb)return; const r=track.getBoundingClientRect(), ratio=(e.clientY-r.top)/r.height; nav.scrollTop=ratio*(nav.scrollHeight-nav.clientHeight)-nav.clientHeight/2;});
 window.addEventListener('load',()=>setTimeout(update,50)); requestAnimationFrame(update);
})();
</script>

<script>
/* V2.2.1 : le menu mobile manipule les vrais contrôles, sans clonage. */
(function(){
 const mobile=()=>window.matchMedia('(max-width:850px)').matches;
 const panel=document.getElementById('mobileNavPanel');
 const btn=document.getElementById('mobileNavBtn');
 const bar=document.querySelector('.mobileNavBar');
 const roleBox=panel.querySelector('.roleBox');
 const navTitle=panel.querySelector('.navTitle');
 const settings=document.getElementById('settingsPanel');
 const originalSettingsParent=settings.parentNode;
 const originalSettingsNext=settings.nextSibling;
 const head=document.createElement('div');head.className='mobileMenuHead';
 head.innerHTML='<span>Répétition</span><button type="button" class="mobileClose" aria-label="Fermer le menu">×</button>';
 const tabs=document.createElement('div');tabs.className='mobileTabs';
 tabs.innerHTML='<button type="button" data-mobile-tab="roles">Personnages</button><button type="button" data-mobile-tab="scenes">Actes & scènes</button><button type="button" data-mobile-tab="voices">Voix</button>';
 const voiceArea=document.createElement('div');voiceArea.className='mobileVoiceArea';
 panel.insertBefore(head,panel.firstChild);panel.insertBefore(tabs,head.nextSibling);panel.appendChild(voiceArea);
 function setTab(t){panel.dataset.mobileTab=t;tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.mobileTab===t));if(t==='voices'&&typeof renderVoices==='function')renderVoices()}
 function close(){panel.classList.remove('mobileOpen');btn.setAttribute('aria-expanded','false')}
 function open(t){setTab(t);panel.classList.add('mobileOpen');btn.setAttribute('aria-expanded','true')}
 function place(){if(mobile()){if(roleBox.parentNode!==panel)panel.insertBefore(roleBox,navTitle);if(settings.parentNode!==voiceArea)voiceArea.appendChild(settings)}else{if(settings.parentNode!==originalSettingsParent)originalSettingsParent.insertBefore(settings,originalSettingsNext);close()}}
 place();setTab('roles');
 btn.addEventListener('click',()=>{if(!mobile())return; if(panel.classList.contains('mobileOpen'))close();else open('roles')});
 head.querySelector('button').addEventListener('click',close);
 tabs.addEventListener('click',e=>{const b=e.target.closest('[data-mobile-tab]');if(b)setTab(b.dataset.mobileTab)});
 document.getElementById('sceneNav').addEventListener('click',e=>{if(mobile()&&e.target.closest('button[data-id]'))close()});
 window.addEventListener('resize',place);
 const main=document.getElementById('mainBtn');
 const observer=new MutationObserver(()=>{main.classList.toggle('mobilePlaying',/^\s*⏸/.test(main.textContent))});
 observer.observe(main,{childList:true,subtree:true,characterData:true});
 main.classList.toggle('mobilePlaying',/^\s*⏸/.test(main.textContent));
})();
</script>
